# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=0.15.3
maven_group=org.wynnvets
archives_base_name=vetsmod

# Dependencies
fabric_api_version=0.141.3+1.21.11

# Formatting
# Check for latest at https://plugins.gradle.org/plugin/com.diffplug.spotless
#
# google-java-format reads javac internals that JEP 396 encapsulates, and its
# README tells you to add five --add-exports to org.gradle.jvmargs. Measured on
# this stack (Gradle 9.2.1, JDK 21, Spotless 8.4.0): not needed — spotlessApply
# and spotlessCheck both run clean over all 167 files without them, and without
# raising -Xmx either. Don't add them back on the strength of the README; add
# them only if a real IllegalAccessError shows up.
spotless_version=8.4.0
# Pinned separately from the plugin: 8.4.0's default gjf is 1.28.0, and a plugin
# bump that moved the default would silently reformat all 167 files.
google_java_format_version=1.28.0