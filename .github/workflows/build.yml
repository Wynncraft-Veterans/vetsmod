# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: format and javadoc gates
        run: ./gradlew spotlessCheck compileJava compileClientJava compileTestJava
      - name: build
        run: ./gradlew build
      # Only runs on a red build. The `build` step above already fails the
      # job; this makes a test failure legible without re-running it locally,
      # which the later cleanup phases lean on.
      - name: capture test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/