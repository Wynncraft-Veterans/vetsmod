# Retro (2013) rules: what the retro pack replaces and with what, and what retro draws over the
# screens. .claude/vetsmod_retro.md has the design.
#
# Conventions:
# - Ids are written in full, namespace first: a texture id names a PNG under textures/
#   ('minecraft:block/stone'), a model id a JSON under models/, an item id an item definition under
#   items/ ('minecraft:stick'), an equipment id a file under equipment/.
# - Quote every string but keywords (keep, blank, auto, handheld...) and the file's own lower-case
#   names (recipes, families, stems, parts), in single quotes when it holds a backslash ('_\d+').
# - A pattern is a Java regex matching the whole id. In a mapping keyed by patterns the first
#   matching row decides, unless its comment says otherwise; in a list of patterns any match
#   counts. In a value, $1, $2... are the pattern's groups.
# - A rectangle is [x, y, width, height] from the top left.
# - Each section, and each key within one, appears once; a key a row may not have fails the build.
#
# Headings: Textures, Items, Other files, Stacks, Screens, Wynntils settings, and last Parts, which
# says what a player can turn off.

# ==== Textures ===============================================================================

# A texture is decided by the first of keep_wynncraft, tints, aliases and same_name that matches it
# (same_name only where a source has the texture), whether or not Wynncraft ships it; otherwise
# Wynncraft's stays (one it ships fully transparent is a deliberate blank). Then layer_groups undoes
# a group not drawn whole from one source, image_edits paints over a copy or tint, and
# blank_textures blanks outright.

# ---- Sources --------------------------------------------------------------------------------

# Texture pattern -> the packs it is read from, oldest art first; the first that has it supplies it,
# with its .mcmeta. An alias or tint reads the row of the texture it copies.
# - '1.7.10', '1.8.9', '1.9.4': what old_clients takes from those clients (nothing until fetched).
# - vetsmod: vetsmod's own art, downloaded from i.wynnvets.org (nothing until fetched).
# - vanilla_tweaks: the bundled Vanilla Tweaks art (credits.txt).
# - programmer_art: the client's Programmer Art (1.13's art). vanilla: today's.
sources:
  # Villagers are 1.7.10's whole or today's: a layered entity comes from one source (layer_groups).
  'minecraft:entity/(zombie_)?villager/.*': ['1.7.10', vanilla]
  # The main menu shows Old Detlas, screenshots taken with retro on, over Wynncraft's Detlas. From
  # vetsmod alone, so until it is downloaded Wynncraft's stays rather than vanilla's.
  'minecraft:gui/title/background/panorama_[0-5]': [vetsmod]
  # The UI stays today's (Programmer Art's few GUI files would mix two looks), but for 1.7.10's
  # armour-slot silhouettes and the withered hearts, which Vanilla Tweaks makes readable.
  'minecraft:gui/sprites/hud/heart/withered_(half|full)(_blinking)?': [vanilla_tweaks, vanilla]
  'minecraft:gui/.*': ['1.7.10', vanilla]
  '.*': ['1.7.10', '1.8.9', '1.9.4', vanilla_tweaks, programmer_art, vanilla]

# ---- Old clients ----------------------------------------------------------------------------

# Client -> texture pattern -> that client's texture written in its place (a full id under its
# textures/, without .png), or blank (fully transparent, at today's size). A row names the oldest
# client whose art has today's size and layout and is not Programmer Art's or vanilla's already.
# The player's game fetches these files from Mojang once.
old_clients:
  '1.7.10':
    'minecraft:block/light_gray_wool': 'minecraft:blocks/wool_colored_silver'
    'minecraft:block/(\w+)_wool': 'minecraft:blocks/wool_colored_$1'
    'minecraft:block/cauldron_(bottom|side|top)': 'minecraft:blocks/cauldron_$1'
    'minecraft:block/hopper_top': 'minecraft:blocks/hopper_top'
    'minecraft:block/short_grass': 'minecraft:blocks/tallgrass'
    'minecraft:block/tall_grass_(bottom|top)': 'minecraft:blocks/double_plant_grass_$1'
    'minecraft:block/peony_top': 'minecraft:blocks/double_plant_paeonia_top'
    'minecraft:block/water_(still|flow)': 'minecraft:blocks/water_$1'
    'minecraft:entity/chicken/temperate_chicken': 'minecraft:entity/chicken'
    'minecraft:entity/skeleton/(skeleton|wither_skeleton)': 'minecraft:entity/skeleton/$1'
    # The five 2013 villagers, by the careers 1.8 gave them, and the green robe for any other.
    # 1.7 had no biome or level layers.
    'minecraft:entity/villager/profession/(farmer|fisherman|shepherd|fletcher)': 'minecraft:entity/villager/farmer'
    'minecraft:entity/villager/profession/(librarian|cartographer)': 'minecraft:entity/villager/librarian'
    'minecraft:entity/villager/profession/cleric': 'minecraft:entity/villager/priest'
    'minecraft:entity/villager/profession/(armorer|weaponsmith|toolsmith|mason)': 'minecraft:entity/villager/smith'
    'minecraft:entity/villager/profession/(butcher|leatherworker)': 'minecraft:entity/villager/butcher'
    'minecraft:entity/villager/(villager|profession/nitwit)': 'minecraft:entity/villager/villager'
    'minecraft:entity/villager/(type|profession_level)/\w+': blank
    'minecraft:gui/sprites/container/slot/(helmet|chestplate|leggings|boots)': 'minecraft:items/empty_armor_slot_$1'
    'minecraft:item/(cod|salmon)': 'minecraft:items/fish_$1_raw'
    'minecraft:item/cooked_(cod|salmon)': 'minecraft:items/fish_$1_cooked'
    'minecraft:item/pufferfish': 'minecraft:items/fish_pufferfish_raw'
    'minecraft:item/tropical_fish': 'minecraft:items/fish_clownfish_raw'
    'minecraft:item/cooked_(beef|porkchop)': 'minecraft:items/$1_cooked'
    'minecraft:item/enchanted_book': 'minecraft:items/book_enchanted'
    'minecraft:item/map': 'minecraft:items/map_empty'
    'minecraft:item/filled_map': 'minecraft:items/map_filled'
    'minecraft:item/iron_door': 'minecraft:items/door_iron'
    'minecraft:item/oak_door': 'minecraft:items/door_wood'
    'minecraft:item/(name_tag|potion_overlay)': 'minecraft:items/$1'
    'minecraft:item/oak_boat': 'minecraft:items/boat'
  '1.8.9':
    'minecraft:block/(acacia|birch|dark_oak|jungle)_door_bottom': 'minecraft:blocks/door_$1_lower'
    'minecraft:block/(acacia|birch|dark_oak|jungle)_door_top': 'minecraft:blocks/door_$1_upper'
    'minecraft:entity/(banner_base|banner/\w+)': 'minecraft:entity/$1'
  '1.9.4':
    'minecraft:block/(structure_block\w*|water_overlay)': 'minecraft:blocks/$1'
    'minecraft:entity/shield/(\w+)': 'minecraft:entity/shield/$1'
    'minecraft:entity/shulker/shulker': 'minecraft:entity/shulker/endergolem'

# Texture pattern -> rectangles cleared in the old client's texture written there: what today's
# model draws but the old one did not. Every matching row clears its own.
old_client_clears:
  # 1.7's villagers had no hat and a robe two pixels shorter: three carry a hood there, four a hem.
  'minecraft:entity/villager/(villager|profession/\w+)': [[32, 0, 32, 18], [0, 62, 28, 2]]

# ---- Keep Wynncraft's -----------------------------------------------------------------------

# Texture pattern: Wynncraft's texture stays, whatever tints, aliases and same_name say.
keep_wynncraft:
  - 'minecraft:block/tripwire'                        # blank: tripwires are invisible
  # Drawn as nothing by its blockstate; the keys draw a copy of the 2013 hook (source_copies).
  - 'minecraft:block/tripwire_hook'
  - 'minecraft:block/(wet_)?sponge'                   # its sponges cycle through colours
  - 'minecraft:block/daylight_detector_\w+'           # the block is a stack of books
  - 'minecraft:item/barrier'                          # Wynncraft's own red cross
  - 'minecraft:item/light_\d+'                        # the invisible light block's icons
  # Blank: the offhand slot's silhouette, over the panel grey image_edits paints there.
  - 'minecraft:gui/sprites/container/slot/shield'
  - 'minecraft:mob_effect/(haste|mining_fatigue)'     # the "Attack Speed" up and down arrows
  - 'minecraft:entity/trident'                        # blank
  - 'minecraft:entity/iron_golem/iron_golem_crackiness_\w+'   # blank: golems never crack
  - 'minecraft:entity/equipment/\w+/copper'           # no 2013 copper armour (equipment)
  - 'minecraft:particle/.*'                           # Wynncraft builds spell effects from these

# ---- Tints ----------------------------------------------------------------------------------

# Texture pattern -> a source's texture with each channel multiplied by a factor, then its contrast
# changed: 2013 art in Wynncraft's colour, for blocks 2013 lacked or whose 2013 art clashes. A row
# has a tint, a contrast or both:
# - source: the texture tinted, read through sources; the row's own texture without one.
# - tint: '#RRGGBB' (multiplies, as Minecraft's tints do); {match: <texture>} (takes that
#   texture's mean, read through sources); auto (takes the mean of Wynncraft's texture);
#   {relative_to: <texture>} (changes as Wynncraft changed its texture from that one);
#   {like: <texture id>} (exactly what that texture's row does to it, so the pixels they share come
#   out alike; no strength or contrast of its own).
# - strength: how much of the tint, 0 to 1 (1 by default).
# - contrast: around the tinted mean, below 1 flatter, above 1 busier (1 by default).
tints:
  # Wynncraft's plants are green before the biome's tint, 2013's grey: Wynncraft's colour, so a
  # biome tints them alike.
  'minecraft:block/(fern|large_fern_(top|bottom)|short_grass|tall_grass_(top|bottom)|vine)':
    tint: auto
  'minecraft:block/variants/short_grass_\d+':
    source: 'minecraft:block/short_grass'
    tint: auto
  # Wynncraft's are the brown of its oak logs; the 2013 ones are redder.
  'minecraft:block/(note_block|jukebox_side|jukebox_top)':
    tint: {match: 'minecraft:block/oak_log'}
  # Wynncraft's diorite is nearly white; the 2013 one is greyer.
  'minecraft:block/(polished_)?diorite':
    tint: {match: 'minecraft:block/quartz_block_side'}
  # Newer than 2013: the 2013 nether bricks in their colour.
  'minecraft:block/red_nether_bricks':
    source: 'minecraft:block/nether_bricks'
    tint: {match: 'minecraft:block/red_nether_bricks'}
  # Wynncraft's "dark" stones: the 2013 stone, darkened as Wynncraft darkened its own.
  'minecraft:block/variants/dark_(stone|cobblestone|stone_bricks|cracked_stone_bricks|chiseled_stone_bricks|mossy_stone_bricks)(_\d+)?':
    source: 'minecraft:block/$1'
    tint: {relative_to: 'minecraft:block/$1'}
  # Wynncraft's bedrock is nearly black.
  'minecraft:block/bedrock':
    tint: {match: 'minecraft:block/black_concrete_powder'}
    strength: 0.7
  # Wynncraft's animated molten rock: the 2013 magma in its dark red.
  'minecraft:block/variants/molten_rock(_\d+)?':
    source: 'minecraft:block/magma'
    tint: auto
  # The 2013 furnace faces are far busier than the stone bricks beside them. Each front takes the
  # change of the face beside it, so its stone blends in and the mouth stays dark.
  'minecraft:block/furnace_(side|top)':
    tint: {match: 'minecraft:block/stone_bricks'}
    contrast: 0.45
  'minecraft:block/(dispenser|dropper)_front':
    tint: {like: 'minecraft:block/furnace_side'}
  'minecraft:block/(dispenser|dropper)_front_vertical':
    tint: {like: 'minecraft:block/furnace_top'}
  'minecraft:block/furnace_front(_on)?':
    tint: {like: 'minecraft:block/furnace_side'}

# ---- Aliases --------------------------------------------------------------------------------

# Texture pattern -> the texture copied in its place. Wynncraft's own variants of vanilla blocks
# (block/variants/, picked at random by its blockstates) become the vanilla block.
aliases:
  # Sky Wood is Wynncraft's repainted purpur.
  'minecraft:block/purpur_(block|pillar|pillar_side)': 'minecraft:block/oak_log'
  'minecraft:block/purpur_pillar_top': 'minecraft:block/oak_log_top'
  'minecraft:block/variants/(stone|cobblestone|mossy_cobblestone)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(cracked_stone_bricks|mossy_stone_bricks)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(coal_ore|emerald_ore|redstone_ore)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(dirt|netherrack|sandstone)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/cobweb_\d+': 'minecraft:block/cobweb'
  'minecraft:block/variants/dead_leaves': 'minecraft:block/pale_oak_leaves'   # the void trees'
  'minecraft:block/variants/grass_top_\d+': 'minecraft:block/grass_block_top'
  'minecraft:block/variants/sunflower_(front|back)': 'minecraft:block/sunflower_$1'
  'minecraft:block/variants/sunflower_bottom_\d+': 'minecraft:block/sunflower_bottom'
  'minecraft:block/variants/dirt_top(_\d+)?': 'minecraft:block/dirt'
  'minecraft:block/variants/pumpkin_bottom': 'minecraft:block/pumpkin_top'
  'minecraft:block/variants/oak_(fence|planks_flat)': 'minecraft:block/oak_planks'
  'minecraft:block/variants/iron_bars_top': 'minecraft:block/iron_bars'
  # Wynncraft's pistons are crates: the plank face on every face, 2013's six-sided piston (33:6).
  'minecraft:block/piston_(bottom|inner|side|top_sticky)': 'minecraft:block/piston_top'
  'minecraft:block/variants/piston_(bottom|inner|side_sticky|top_sticky)': 'minecraft:block/piston_top'
  # Every tooltip style Wynncraft adds becomes vanilla's; the gold LEGACY border is a copy
  # (wynncraft_copies).
  'minecraft:gui/sprites/tooltip/\w+_(background|frame)': 'minecraft:gui/sprites/tooltip/$1'
  # The orange armour silhouettes Wynncraft puts in an empty armour slot: vanilla's.
  'minecraft:wynn/gui/slot/(helmet|chestplate|leggings|boots)': 'minecraft:gui/sprites/container/slot/$1'

# ---- Same name ------------------------------------------------------------------------------

# Texture pattern: replaced by the texture of the same id, from its sources. Most of Wynncraft's own
# textures have none and stay.
same_name:
  - 'minecraft:block/.*'
  - 'minecraft:item/.*'
  - 'minecraft:entity/.*'
  - 'minecraft:mob_effect/.*'
  - 'minecraft:painting/.*'                           # Wynncraft repaints them; vanilla's are 1.7.10's
  - 'minecraft:misc/enchanted_glint_armor'
  # The GUI Wynncraft repaints: container backgrounds, buttons, the tooltip, the armour slots'
  # silhouettes (which it blanks), the main menu's panorama.
  - 'minecraft:gui/container/.*'
  - 'minecraft:gui/sprites/widget/.*'
  - 'minecraft:gui/sprites/tooltip/(background|frame)'
  - 'minecraft:gui/sprites/container/slot/(helmet|chestplate|leggings|boots)'
  - 'minecraft:gui/title/background/panorama_[0-5]'
  # The HUD: what RetroHud draws over Wynncraft's blanks (hearts for health, food for mana, armour
  # for sprint and breath, air for the ultimate, the experience bar), and vanilla's jump bar and
  # hotbar.
  - 'minecraft:gui/sprites/hud/heart/(container|half|full|poisoned_half|poisoned_full|withered_half|withered_full)(_blinking)?'
  - 'minecraft:gui/sprites/hud/food_(empty|half|full)'
  - 'minecraft:gui/sprites/hud/armor_(empty|half|full)'
  - 'minecraft:gui/sprites/hud/air(_empty|_bursting)?'
  - 'minecraft:gui/sprites/hud/experience_bar_(background|progress)'
  - 'minecraft:gui/sprites/hud/jump_bar_(background|cooldown|progress)'
  - 'minecraft:gui/sprites/hud/hotbar(_selection|_offhand_left|_offhand_right)?'

# ---- Layer groups ---------------------------------------------------------------------------

# Texture pattern: textures drawn in layers on one model. Unless every member Wynncraft ships comes
# from one source, none is replaced.
layer_groups:
  # Body, biome, profession and badge, one group per model. Wynncraft's unused textures at the
  # folder's top (entity/villager/farmer) are not members.
  - 'minecraft:entity/villager/(villager|type/.*|profession/.*|profession_level/.*)'
  - 'minecraft:entity/zombie_villager/(zombie_villager|type/.*|profession/.*|profession_level/.*)'
  - 'minecraft:entity/horse/horse_(white|creamy|chestnut|brown|black|gray|darkbrown|markings_\w+)'
  - 'minecraft:entity/wolf/.*'                        # body and collar
  - 'minecraft:entity/cat/.*'                         # body and collar
  - 'minecraft:entity/(llama/(white|creamy|brown|gray)|equipment/llama_body/\w+)'   # body and decor
  - 'minecraft:entity/sheep/.*'                       # body, wool and undercoat

# ---- Image edits ----------------------------------------------------------------------------

# Texture id -> rectangles painted on its copy or tint, in order:
# - fill: the rectangle.
# - sample: [x, y] of the pixel whose colour it is painted.
# - palette: the only colours it may hold; otherwise it is left alone and the report says so.
image_edits:
  # No crafting grid or offhand slot (Wynncraft uses neither): panel grey, taking no mouse.
  'minecraft:gui/container/inventory':
    - fill: [97, 17, 74, 36]    # the 2x2 grid, the arrow and the result slot
      sample: [172, 17]
      palette: ['#C6C6C6', '#8B8B8B', '#373737', '#FFFFFF']
    - fill: [76, 61, 18, 18]    # the offhand slot
      sample: [172, 17]
      palette: ['#C6C6C6', '#8B8B8B', '#373737', '#FFFFFF']

# ---- Blank textures -------------------------------------------------------------------------

# Texture ids written fully transparent at their own size, outranking every rule above.
blank_textures: []

# ==== Items ==================================================================================

# Wynncraft's item definitions are never touched: the retro pack replaces the models they name with
# small stubs. A model takes the first of: its ingredients row (under item/wynn/ingredient/), a
# potions row, a row the tables make (materials, content_book_activities), an item_models row.

# ---- Ingredients ----------------------------------------------------------------------------

# Ingredient model stem (its file name under item/wynn/ingredient/) -> the model its stub parents,
# or keep (Wynncraft's model stays; with no row, potions and item_models decide). Only for stems
# whose model parents no vanilla item: same_name gives the others their 2013 art already. Where the
# 2013 icon differs from today's, the row names it, with Wynncraft's legacy icon (its 1.12 number)
# in a comment. Quote a stem YAML would read as a number.
ingredients:
  # Spawn eggs (legacy 383:<mob>); Wynncraft's models parent item/spawn_egg, which 1.21.11 lacks.
  aspect_of_the_void: 'minecraft:item/enderman_spawn_egg'
  cystic_lard: 'minecraft:item/slime_spawn_egg'
  mountains_heart: 'minecraft:item/villager_spawn_egg'
  parasitic_abscission: 'minecraft:item/wither_skeleton_spawn_egg'
  penguin_egg: 'minecraft:item/egg'
  rocky_spirit: 'minecraft:item/light_blue_dye'                  # legacy 351:12
  # Wynncraft's armour models, named here so the icon does not depend on item_models.
  gilded_regalia: 'minecraft:item/golden_chestplate'
  winged_helmet: 'minecraft:item/iron_helmet'
  cursed_wings: 'minecraft:item/elytra'
  # Accessories: their legacy icons were Wynncraft's own art, so accessory_tiers' models.
  burial_talisman: 'vetsmod:item/retro/accessory/necklace_netherite'
  cherished_heirloom: 'vetsmod:item/retro/accessory/necklace_diamond'
  lunar_charm: 'vetsmod:item/retro/accessory/necklace_gold'
  nose_ring: 'vetsmod:item/retro/accessory/ring_iron'
  regretless_talisman: 'vetsmod:item/retro/accessory/necklace_chainmail'
  voidtossed_memory: 'vetsmod:item/retro/accessory/necklace_iron'
  # Shields: a special renderer draws them, so stack_models does.
  butterfly_buckler: keep
  router_shield: keep

# ---- Potions --------------------------------------------------------------------------------

# Potion family -> its liquid's colour, and Avomod's model name if it has one. Wynncraft's
# item/wynn/potion/<family>_<empty|half|full> become the full vanilla potion in that colour (the
# potion_overlay recipe); a family with no row keeps its models. The skill potions take their skill
# point's colour, healing, wisdom and drunkness vanilla's effect colours.
potions:
  strength: {colour: '#00AA00', avomod: potion_sp_strength}
  dexterity: {colour: '#FFFF55', avomod: potion_sp_dexterity}
  intelligence: {colour: '#55FFFF', avomod: potion_sp_intelligence}
  defense: {colour: '#FF5555', avomod: potion_sp_defence}
  agility: {colour: '#FFFFFF', avomod: potion_sp_agility}
  healing: {colour: '#F82423', avomod: potion_health}
  mana: {colour: '#385DC6', avomod: potion_mana}
  wisdom: {colour: '#59C106'}
  drunkness: {colour: '#551D4A'}

# ---- Recipes --------------------------------------------------------------------------------

# Recipe name -> a way to recolour one piece of art, which materials, potions and source_copies ask
# for by name, with a colour:
# - art: the texture, read through sources.
# - scale_from: a colour in that art (its main one), scaled channel by channel to the colour asked.
# - hue_of: the same, on the pixels of that colour's hue alone.
# With neither, the colour multiplies the art, as Minecraft's tints do. A dark outline stays undyed.
recipes:
  bucket: {art: 'minecraft:item/water_bucket', hue_of: '#345FDA'}     # the water alone
  emerald: {art: 'minecraft:item/emerald', hue_of: '#41F384'}
  paper: {art: 'minecraft:item/paper', scale_from: '#D6D6D6'}
  string: {art: 'minecraft:item/string'}
  saddle: {art: 'minecraft:item/saddle', scale_from: '#DA662C'}
  copper_ingot: {art: 'minecraft:item/copper_ingot', scale_from: '#C15A36'}
  iron_ingot: {art: 'minecraft:item/iron_ingot', scale_from: '#D8D8D8'}
  nether_brick: {art: 'minecraft:item/nether_brick', scale_from: '#3E1E24'}
  brick: {art: 'minecraft:item/brick', scale_from: '#B75A40'}
  netherite_ingot: {art: 'minecraft:item/netherite_ingot', scale_from: '#3B393B'}
  prismarine_shard: {art: 'minecraft:item/prismarine_shard', scale_from: '#7FB8A4'}
  clay_ball: {art: 'minecraft:item/clay_ball', scale_from: '#A5A9B9'}
  glowstone_dust: {art: 'minecraft:item/glowstone_dust', scale_from: '#D2D200'}
  nether_wart: {art: 'minecraft:item/nether_wart', scale_from: '#A62530'}
  melon_seeds: {art: 'minecraft:item/melon_seeds', scale_from: '#615535'}
  wheat_seeds: {art: 'minecraft:item/wheat_seeds', scale_from: '#69B038'}
  cocoa_beans: {art: 'minecraft:item/cocoa_beans', scale_from: '#976746'}
  pumpkin_seeds: {art: 'minecraft:item/pumpkin_seeds', scale_from: '#CBC68D'}
  beetroot_seeds: {art: 'minecraft:item/beetroot_seeds', scale_from: '#DEB075'}
  # The fish are 1.7.10's (old_clients): a teal cod, a grey cooked one.
  cooked_cod: {art: 'minecraft:item/cooked_cod', scale_from: '#A9989B'}
  cod: {art: 'minecraft:item/cod', scale_from: '#6B9F93'}
  salmon: {art: 'minecraft:item/salmon', scale_from: '#AB3533'}
  cooked_salmon: {art: 'minecraft:item/cooked_salmon', scale_from: '#BA4F23'}
  oak_door: {art: 'minecraft:item/oak_door', scale_from: '#9F844D'}
  spruce_door: {art: 'minecraft:item/spruce_door', scale_from: '#7A5A36'}
  # Grey art Minecraft colours: a potion's liquid, leather horse armour, plants.
  potion_overlay: {art: 'minecraft:item/potion_overlay'}
  leather_horse_armor: {art: 'minecraft:item/leather_horse_armor'}
  vine: {art: 'minecraft:block/vine'}
  lily_pad: {art: 'minecraft:block/lily_pad'}
  fern: {art: 'minecraft:block/fern'}
  large_fern_top: {art: 'minecraft:block/large_fern_top'}
  short_grass: {art: 'minecraft:block/short_grass'}
  grass_block_top: {art: 'minecraft:block/grass_block_top'}
  grass_block_side_overlay: {art: 'minecraft:block/grass_block_side_overlay'}
  # The hearts' red alone, for the overhealth hearts (source_copies).
  heart_full: {art: 'minecraft:gui/sprites/hud/heart/full', hue_of: '#FF1313'}
  heart_half: {art: 'minecraft:gui/sprites/hud/heart/half', hue_of: '#FF1313'}

# ---- Materials ------------------------------------------------------------------------------

# Family -> its profession materials, each an item_models row drawing flat art:
# - models: the model id prefix each name completes.
# - vanilla: name -> the texture it draws.
# - <recipe>: name -> the colour that recipe gives its art (a copy at
#   vetsmod:item/retro/material/<family>_<name>).
materials:
  ingot:
