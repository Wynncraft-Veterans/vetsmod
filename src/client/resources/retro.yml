      oak: 'minecraft:item/oak_door'
      birch: 'minecraft:item/birch_door'
      acacia: 'minecraft:item/acacia_door'
      spruce: 'minecraft:item/spruce_door'
      jungle: 'minecraft:item/jungle_door'
      dark: 'minecraft:item/dark_oak_door'
      light: 'minecraft:item/iron_door'
      sky: 'minecraft:item/warped_door'
      dernic: 'minecraft:item/crimson_door'
      redwood: 'minecraft:item/mangrove_door'
      maple: 'minecraft:item/cherry_door'
      avo: 'minecraft:item/bamboo_door'
    oak_door: {willow: '#5A6E48'}
    spruce_door: {pine: '#58452F'}
  # In the colour of that wood's planks; the plain papers are item_models' paper row.
  paper:
    models: 'minecraft:item/wynn/economy/woodcutting/paper_'
    paper: {oak: '#9C7F4E', birch: '#C3B37B', acacia: '#A95B33', spruce: '#674D2E',
            jungle: '#9A6E4D', dark: '#3D2712', light: '#BEBEBE', sky: '#2B6863', dernic: '#653046',
            redwood: '#753630', willow: '#4B5C39', avo: '#C1AD50', pine: '#473928',
            maple: '#E2B2AC'}

# ---- Content book activities ----------------------------------------------------------------

# The content book's activities, each one piece of art near Wynncraft's colour for it:
# - models: the model id prefix; an activity's models are <activity>_<active|state>.
# - states: state -> its look, as a recipe's scale_from or hue_of with the colour it takes.
# - activities: name -> its art, drawn as it is when active.
content_book_activities:
  models: 'minecraft:item/wynn/gui/content_book/'
  states:
    tracked: {scale_from: '#808080', colour: '#FFFFFF'}   # brighter, as Wynncraft pulses it
    locked: {colour: '#707070'}                           # dimmer, as Wynncraft pales it
  activities:
    quest: 'minecraft:item/lime_dye'
    story_quest: 'minecraft:item/green_dye'
    mini_quest: 'minecraft:item/purple_dye'
    world_event: 'minecraft:item/cyan_dye'
    discovery: 'minecraft:item/light_blue_dye'
    cave: 'minecraft:item/orange_dye'
    dungeon: 'minecraft:item/pink_dye'
    raid: 'minecraft:item/red_dye'
    boss_altar: 'minecraft:item/yellow_dye'
    loot_camp: 'minecraft:item/lapis_lazuli'
    time_trial: 'minecraft:item/magenta_dye'
    mount_enclosure: 'minecraft:item/cocoa_beans'

# ---- Item models ----------------------------------------------------------------------------

# Model pattern -> what its stub draws:
# - a texture id, in block/ or item/: held flat, on a layer the stack's colour does not tint.
# - {texture: <id>, parent: handheld | handheld_rod | bow | generated}: held like that vanilla item.
# - {model: <id>}: that model as the stub's parent, tinted by the stack's colour as the vanilla
#   item is (a dyed item keeps its dye).
item_models:
  # -- Gear
  # Weapons: one vanilla item per class, for the plain models and every skin.
  'minecraft:item/wynn/(weapon/\w+/spear_|skin/spear/)\w+': {texture: 'minecraft:item/iron_shovel', parent: handheld}
  'minecraft:item/wynn/(weapon/\w+/wand_|skin/wand/)\w+': {texture: 'minecraft:item/stick', parent: handheld}
  # The frying pan is also every cooking station's pan, so it stays Wynncraft's.
  'minecraft:item/wynn/(weapon/\w+/dagger_|skin/dagger/(?!frying_pan$))\w+': 'minecraft:item/shears'
  'minecraft:item/wynn/(weapon/\w+/bow_|skin/bow/)\w+': {texture: 'minecraft:item/bow', parent: bow}
  'minecraft:item/wynn/(weapon/\w+/relik_|skin/relik/)\w+': {texture: 'minecraft:item/iron_pickaxe', parent: handheld}
  # Armour: the vanilla piece of the same material (pale_ is a paler copy).
  'minecraft:item/wynn/armor/\w+/(?:pale_)?gold_(helmet|chestplate|leggings|boots)': 'minecraft:item/golden_$1'
  'minecraft:item/wynn/armor/\w+/(?:pale_)?(chainmail|iron|diamond|netherite)_(helmet|chestplate|leggings|boots)': 'minecraft:item/$1_$2'
  # Titanium, Wynncraft's tier above diamond: netherite.
  'minecraft:item/wynn/armor/\w+/(?:pale_)?titanium_(helmet|chestplate|leggings|boots)': 'minecraft:item/netherite_$1'
  # Leather keeps the stack's dye, as vanilla's leather does.
  'minecraft:item/wynn/armor/\w+/(?:pale_)?leather_(helmet|chestplate|leggings|boots)': {model: 'minecraft:item/leather_$1'}
  # Profession tools, whatever their material.
  'minecraft:item/wynn/tool/\w+_axe': {texture: 'minecraft:item/iron_axe', parent: handheld}
  'minecraft:item/wynn/tool/\w+_pickaxe': {texture: 'minecraft:item/iron_pickaxe', parent: handheld}
  'minecraft:item/wynn/tool/\w+_rod': {texture: 'minecraft:item/fishing_rod', parent: handheld_rod}
  'minecraft:item/wynn/tool/\w+_scythe': {texture: 'minecraft:item/iron_hoe', parent: handheld}
  # Unidentified gear boxes, in the GUI (gui/loot/) and held (loot/): one chest; the GUI draws
  # the box's type over it (gear_box_icons).
  'minecraft:item/wynn/(gui/)?loot/(unique|rare|legendary|fabled|mythic|set)': {model: 'vetsmod:item/retro/chest'}
  # Mastery tomes: the enchanted book, their type drawn over it in the GUI (outlined_icons).
  'minecraft:item/wynn/mastery_tome/\w+': 'minecraft:item/enchanted_book'

  # -- Other items
  # Dungeon keys, broken or not: the 2013 tripwire hook (source_copies).
  'minecraft:item/wynn/dungeon/key(_broken)?': 'vetsmod:block/retro/tripwire_hook'
  # Hashr's Crown, the Sand-Swept Tomb's token.
  'minecraft:item/wynn/dungeon/token/sand_swept_tomb': 'minecraft:item/golden_helmet'
  'minecraft:item/wynn/scroll/\w+': 'minecraft:item/map'                 # teleportation scrolls
  # The woodcutting papers and scrolls (crafting paper, Raid scrolls, notes).
  'minecraft:item/wynn/economy/woodcutting/(?:paper_(?:brown|cream|white)|scroll_\w+)': 'minecraft:item/paper'
  # Meals: the nearest food, 2013's where one fits.
  'minecraft:item/wynn/economy/meals/fried': 'minecraft:item/cooked_chicken'  # a drumstick
  'minecraft:item/wynn/economy/meals/generic(_item)?': 'minecraft:item/cooked_beef'  # a steak on a plate
  'minecraft:item/wynn/economy/meals/salad': 'minecraft:item/beetroot_soup'   # 2013's one bowl is the soup's
  'minecraft:item/wynn/economy/meals/soup': 'minecraft:item/mushroom_stew'
  'minecraft:item/wynn/economy/meals/spicy': 'minecraft:item/bread'  # a filled flatbread
  'minecraft:item/wynn/economy/meals/steamed': 'minecraft:item/baked_potato'  # a leaf-wrapped dumpling
  # Mount saddles (the raptor's red, the wyvern's white) and what calls each mount.
  'minecraft:item/wynn/mount/horse_saddle': 'minecraft:item/saddle'
  'minecraft:item/wynn/mount/raptor_saddle': 'vetsmod:item/retro/saddle_red'
  'minecraft:item/wynn/mount/wyvern_saddle': 'vetsmod:item/retro/saddle_white'
  'minecraft:item/wynn/mount/horse_whistle': {model: 'vetsmod:item/retro/leather_horse_armor'}
  'minecraft:item/wynn/mount/wyvern_whistle': 'minecraft:item/iron_horse_armor'
  'minecraft:item/wynn/mount/raptor_whistle': 'minecraft:item/copper_horse_armor'
  # The ingredient pouch and the crafter bags: the bundle, which 2013 lacked.
  'minecraft:item/wynn/pouch/(ingredient_(empty|half|full)|crafter_(varied|packed|stuffed))': 'minecraft:item/bundle'
  # Runes: music discs. The blank rune keeps Wynncraft's art.
  'minecraft:item/wynn/rune/nii': {model: 'minecraft:item/music_disc_mellohi'}
  'minecraft:item/wynn/rune/az': {model: 'minecraft:item/music_disc_wait'}
  'minecraft:item/wynn/rune/tol': {model: 'minecraft:item/music_disc_cat'}
  'minecraft:item/wynn/rune/ek': {model: 'minecraft:item/music_disc_13'}
  'minecraft:item/wynn/rune/uth': {model: 'minecraft:item/music_disc_mall'}
  # Wards: the stained glass block of their colour.
  'minecraft:item/wynn/ward/(black|blue|cyan|green|orange|pink|purple|red|white|yellow)': {model: 'minecraft:block/$1_stained_glass'}
  # Powders: the dyes Wynncraft's own item definitions (items/<colour>_dye.json) send them to.
  'minecraft:item/wynn/powder/small_air': 'minecraft:item/gray_dye'
  'minecraft:item/wynn/powder/large_air': 'minecraft:item/light_gray_dye'
  'minecraft:item/wynn/powder/small_earth': 'minecraft:item/lime_dye'
  'minecraft:item/wynn/powder/large_earth': 'minecraft:item/green_dye'
  'minecraft:item/wynn/powder/small_thunder': 'minecraft:item/yellow_dye'
  'minecraft:item/wynn/powder/large_thunder': 'minecraft:item/orange_dye'
  'minecraft:item/wynn/powder/small_water': 'minecraft:item/light_blue_dye'
  'minecraft:item/wynn/powder/large_water': 'minecraft:item/cyan_dye'
  'minecraft:item/wynn/powder/small_fire': 'minecraft:item/pink_dye'
  'minecraft:item/wynn/powder/large_fire': 'minecraft:item/red_dye'
  # Corkian augments.
  'minecraft:item/wynn/augment/corkian_amplifier': 'minecraft:item/shulker_shell'
  'minecraft:item/wynn/augment/corkian_simulator': 'minecraft:item/ender_eye'
  'minecraft:item/wynn/augment/corkian_insulator': 'minecraft:item/spectral_arrow'
  # The ability shard: a lingering potion in the colour of its name.
  'minecraft:item/wynn/player/ability_shard': {model: 'vetsmod:item/retro/ability_shard'}
  # Grey plant art, which Minecraft colours by biome or item definition and a potion stack leaves
  # grey: green copies (source_copies). A new item on these textures needs adding here.
  'minecraft:item/wynn/(?:dungeon/fragment/undergrowth_ruins|ingredient/(?:alga|algae_mat|ancient_moss|bioluminescent_moss|creepvine_cluster|thick_vines))': 'vetsmod:block/retro/green/vine'
  'minecraft:item/wynn/ingredient/(?:decomposing_snapdragon|etheric_fern|liff_leaf|pristine_liff_leaf|munched_grass|secret_herb|sticky_fern|undiscovered_plant|viral_tentacle)': 'vetsmod:block/retro/green/fern'
  'minecraft:item/wynn/ingredient/(?:canyon_parsley|illicit_helmlock|mega_fern|water_dropwort)': 'vetsmod:block/retro/green/large_fern_top'
  'minecraft:item/wynn/ingredient/(?:hunters_disguise|waterfall_thyme)': 'vetsmod:block/retro/green/short_grass'
  'minecraft:item/wynn/ingredient/(?:gert_skin|green_fin|green_foot|green_scale|sludge_parasite)': 'vetsmod:block/retro/green/lily_pad'
  'minecraft:item/wynn/outer_void/drop/arable_chunk': {model: 'vetsmod:item/retro/arable_chunk'}   # a grass block

  # -- Interface
  # Wynncraft's tier layer under runes and wards, which Wynntils' highlight misses: retro's tag.
  'minecraft:item/wynn/gui/layer/tier/(tab|full)': {model: 'vetsmod:item/retro/tier_tag'}
  'minecraft:item/wynn/(gui/)?player/content_book': 'minecraft:item/knowledge_book'
  # The content book's buttons beside its activities (content_book_activities).
  'minecraft:item/wynn/gui/content_book/world_event_complete': 'minecraft:item/green_dye'
  'minecraft:item/wynn/gui/content_book/complete': 'minecraft:item/bone_meal'
  'minecraft:item/wynn/gui/content_book/locked': 'minecraft:item/gray_dye'
  # An empty accessory slot: the outline of its type's art (accessory_tiers).
  'minecraft:item/wynn/gui/slot/(ring|bracelet|necklace)': {model: 'vetsmod:item/retro/accessory/$1_empty'}
  # The compass menu's buttons and the guild's boosts.
  'minecraft:item/wynn/gui/character_info/recruit_friend': 'minecraft:item/structure_void'
  'minecraft:item/wynn/gui/character_info/daily_(?:available|cooldown)': {model: 'vetsmod:item/retro/chest'}
  'minecraft:item/wynn/gui/character_info/store': {model: 'vetsmod:item/retro/ender_chest'}
  'minecraft:item/wynn/gui/character_info/ability_tree': 'minecraft:item/enchanted_book'
  'minecraft:item/wynn/gui/character_info/skill_crystal': 'minecraft:item/slime_ball'
  'minecraft:item/wynn/gui/character_info/book_(agility|defense|dexterity|intelligence|strength)': 'minecraft:item/written_book'
  'minecraft:item/wynn/gui/store/silverbull_emblem': {model: 'minecraft:block/sea_lantern'}
  # The brown bar over a player trade's centre column: blank, so each slot's tooltip still shows.
  'minecraft:item/wynn/gui/(trade_icon|column)': {model: 'vetsmod:item/retro/blank'}

# ==== Other files ============================================================================

# What else the pack writes: worn armour, block models, copies at vetsmod's ids, Wynntils' textures
# and language files.

# ---- Equipment ------------------------------------------------------------------------------

# Equipment id pattern -> the vanilla asset whose file replaces Wynncraft's, or keep (Wynncraft's
# stays, as with no row). Only vanilla's file draws vanilla's layers: Wynncraft's dye every layer.
equipment:
  'minecraft:hidden': keep                            # the player's own armour: drawn invisible
  'minecraft:(pale_)?leather': 'minecraft:leather'
  'minecraft:(pale_)?(chainmail|iron|gold|diamond|netherite)': 'minecraft:$2'
  'minecraft:(pale_)?titanium': 'minecraft:netherite'  # as its item is (item_models)
  'minecraft:tan': keep
  'minecraft:shaman': keep
  'minecraft:(pale_)?copper': keep                    # no 2013 copper armour
  'minecraft:quartz': keep
  'minecraft:infernal': keep
  'minecraft:gendarme': keep
  'minecraft:phantom': keep
  'minecraft:wings': keep

# ---- Block models ---------------------------------------------------------------------------

# Block model id -> the model drawn instead. Wynncraft's redstone torches are its candles; vanilla's
# candle has no wall form, so vetsmod's stands in.
block_models:
  'minecraft:block/redstone_torch': 'minecraft:block/candle_one_candle_lit'
  'minecraft:block/redstone_torch_off': 'minecraft:block/candle_one_candle'
  'minecraft:block/redstone_wall_torch': 'vetsmod:block/retro/wall_candle_lit'
  'minecraft:block/redstone_wall_torch_off': 'vetsmod:block/retro/wall_candle'

# ---- Copies of the sources' textures --------------------------------------------------------

# vetsmod texture id -> a texture copied there through sources, with its .mcmeta, or
# {<recipe>: '#RRGGBB'}, that recipe's art in that colour: art a stub or the HUD needs at an id of
# its own. materials, content_book_activities and potions add their own rows.
source_copies:
  'vetsmod:block/retro/tripwire_hook': 'minecraft:block/tripwire_hook'   # the keys
  'vetsmod:item/retro/ability_shard_liquid': {potion_overlay: '#82EFF4'}
  'vetsmod:item/retro/saddle_red': {saddle: '#C8241C'}
  'vetsmod:item/retro/saddle_white': {saddle: '#E9E9E9'}
  # Vanilla's item definition dyes the grey art this colour; a white stack would leave it grey.
  'vetsmod:item/retro/leather_horse_armor_dyed': {leather_horse_armor: '#A06540'}
  # The gear boxes' and the store's chests, into the blocks atlas: today's chest (1.7.10's has
  # another layout) and Programmer Art's ender chest.
  'vetsmod:block/retro/chest': 'minecraft:entity/chest/normal'
  'vetsmod:block/retro/ender_chest': 'minecraft:entity/chest/ender'
  # Green plants in the colours vanilla gives their items: the vine's and lily pad's constants,
  # and the grass colour at temperature 0.5 and downfall 1.0.
  'vetsmod:block/retro/green/vine': {vine: '#48B518'}
  'vetsmod:block/retro/green/lily_pad': {lily_pad: '#71C35C'}
  'vetsmod:block/retro/green/fern': {fern: '#7CBD6B'}
  'vetsmod:block/retro/green/large_fern_top': {large_fern_top: '#7CBD6B'}
  'vetsmod:block/retro/green/short_grass': {short_grass: '#7CBD6B'}
  'vetsmod:block/retro/green/grass_block_top': {grass_block_top: '#7CBD6B'}
  'vetsmod:block/retro/green/grass_block_side_overlay': {grass_block_side_overlay: '#7CBD6B'}
  # Overhealth (RetroHud): a colour of heart for each row of it.
  'vetsmod:gui/sprites/retro/heart/orange_full': {heart_full: '#FF8C13'}
  'vetsmod:gui/sprites/retro/heart/orange_half': {heart_half: '#FF8C13'}
  'vetsmod:gui/sprites/retro/heart/yellow_full': {heart_full: '#FFE213'}
  'vetsmod:gui/sprites/retro/heart/yellow_half': {heart_half: '#FFE213'}
  'vetsmod:gui/sprites/retro/heart/green_full': {heart_full: '#13D813'}
  'vetsmod:gui/sprites/retro/heart/green_half': {heart_half: '#13D813'}

# ---- Copies of Wynncraft's textures ---------------------------------------------------------

# vetsmod texture id -> a texture copied there as the game shows it without retro, with its .mcmeta,
# before the rules above replace it.
wynncraft_copies:
  # Wynntils' tag highlight, for Wynncraft's tier layer (item_models).
  'vetsmod:item/retro/tier_tag': 'wynntils:ui_components/sprites/highlight_tag'
  # The gold LEGACY tooltip border: Wynncraft's unique style, kept as vetsmod:legacy.
  'vetsmod:gui/sprites/tooltip/legacy_background': 'minecraft:gui/sprites/tooltip/unique_background'
  'vetsmod:gui/sprites/tooltip/legacy_frame': 'minecraft:gui/sprites/tooltip/unique_frame'
  # The backgrounds of containers that keep Wynncraft's label (container_titles).
  'vetsmod:gui/container/wynncraft/generic_54': 'minecraft:gui/container/generic_54'
  'vetsmod:gui/container/wynncraft/hopper': 'minecraft:gui/container/hopper'
  'vetsmod:gui/container/wynncraft/horse': 'minecraft:gui/container/horse'

# ---- Wynntils textures ----------------------------------------------------------------------

# Wynntils texture id -> what is drawn in its place, at its size: blank, or frames stacked top to
# bottom, each an equal share of the height, nine-sliced from a vanilla texture:
# - source: the texture.
# - region: the rectangle used (without one, the whole texture).
# - border: the width of the corners and edges, in pixels.
wynntils_textures:
  'wynntils:ui_components/emerald_count_background': blank
  # The bank's page panel: the demo screen's plain panel.
  'wynntils:ui_components/bank_panel':
    - {source: 'minecraft:gui/demo_background', region: [0, 0, 248, 166], border: 4}
  # The bank's quick-jump buttons: vanilla's, normal over highlighted.
  'wynntils:ui_components/quick_jump_button':
    - {source: 'minecraft:gui/sprites/widget/button', border: 3}
    - {source: 'minecraft:gui/sprites/widget/button_highlighted', border: 3}

# ---- Language -------------------------------------------------------------------------------

# Strings written into each locale, restoring vanilla's where Wynncraft blanks or renames them.
# Never restore container.crafting: the inventory has no crafting grid (image_edits).
lang:
  locales: ['en_us', 'en_gb', 'en_ca', 'en_au', 'en_nz']
  strings:
    'container.inventory': 'Inventory'
    'menu.returnToGame': 'Back to Game'
    'menu.game': 'Game Menu'

# ==== Stacks =================================================================================

# What a single stack draws, chosen by its Wynntils type or name while the retro pack is drawn.

# ---- Gear box icons -------------------------------------------------------------------------

# Groups of Wynntils gear or tome types whose icon is a vanilla item, drawn over an unidentified gear
# box (every box is one chest) or mastery tome of that type. A group has:
# - scale: the item's size, as a share of the slot.
# - items: type -> item id.
gear_box_icons:
  - scale: 0.75                                       # armour and accessories, over their box's chest
    items:
      'HELMET': 'minecraft:iron_helmet'
      'CHESTPLATE': 'minecraft:iron_chestplate'
      'LEGGINGS': 'minecraft:iron_leggings'
      'BOOTS': 'minecraft:iron_boots'
      # Vanilla has no accessories: a nugget for a ring, a looped lead, a clock worn on the wrist.
      'RING': 'minecraft:gold_nugget'
      'NECKLACE': 'minecraft:lead'
      'BRACELET': 'minecraft:clock'
  - scale: 0.6875                                     # the Allegiance tome, over its glinting book
    items:
      'GUILD_TOME': 'minecraft:shield'                # no flat art: a special renderer draws it

# ---- Outlined icons -------------------------------------------------------------------------

# Groups of Wynntils types whose icon is flat art redrawn with a dark outline, so it reads over the
# box or book beneath; a type here wins over gear_box_icons. A group has:
# - scale: the icon's size, as a share of the slot.
# - outline: its thickness in the art's pixels, and its colour.
# - art: type -> texture.
outlined_icons:
  - scale: 0.625                                      # a weapon, over its box's chest
    outline: {pixels: 1, colour: '#191919'}
    art:
      'SPEAR': 'minecraft:item/iron_shovel'
      'WAND': 'minecraft:item/stick'
      'DAGGER': 'minecraft:item/shears'
      'BOW': 'minecraft:item/bow'
      'RELIK': 'minecraft:item/iron_pickaxe'
  - scale: 0.6875                                     # a mastery tome, the Allegiance shield's size
    outline: {pixels: 1, colour: '#191919'}
    art:
      'ARMOUR_TOME': 'minecraft:item/iron_helmet'
      'WEAPON_TOME': 'minecraft:item/iron_sword'
      'MARATHON_TOME': 'minecraft:item/iron_boots'
      'EXPERTISE_TOME': 'minecraft:item/iron_hoe'
      'MYSTICISM_TOME': 'minecraft:item/arrow'
      'LOOTRUN_TOME': 'minecraft:block/tripwire_hook'

# ---- Accessory tiers ------------------------------------------------------------------------

# Rings, bracelets and necklaces show their level as armour does: each type's art recoloured per
# tier. A stack whose level Wynntils does not know stays Wynncraft's.
# - outline_below_luma: darker pixels turn the grey of their luma, so the outline is grey in every
#   tier, as an armour icon's is.
# - empty_outline, empty_lines_below_luma: an empty slot's outline colour, and how dark inner lines
#   must be to take it.
# - art: type -> Wynncraft's texture every accessory of that type is drawn from.
# - tiers: lowest first, each up to (not including) its below; a ramp runs dark to light.
accessory_tiers:
  outline_below_luma: 64
  empty_outline: '#373737'
  empty_lines_below_luma: 30
  art:
    'RING': 'minecraft:wynn/accessory/ring_purity'
    'BRACELET': 'minecraft:wynn/accessory/bracelet_base'
    'NECKLACE': 'minecraft:wynn/accessory/necklace_base'
  tiers:
    - {name: leather, below: 20, ramp: ['#1C0E06', '#5B3419', '#8E5A33', '#B98055', '#E2B48C']}
    - {name: gold, below: 40, ramp: ['#3A2500', '#A8730A', '#E0B420', '#F8E050', '#FFFBC0']}
    - {name: chainmail, below: 60, ramp: ['#101010', '#3C3C3C', '#6A6A6A', '#969696', '#C8C8C8']}
    - {name: iron, below: 80, ramp: ['#202020', '#6E6E6E', '#A8A8A8', '#D8D8D8', '#FFFFFF']}
    - {name: diamond, below: 100, ramp: ['#06302C', '#147A70', '#2CCDB1', '#6FF0DC', '#D8FFF8']}
    - {name: netherite, ramp: ['#0C0A0C', '#2C282C', '#463F46', '#625A62', '#8C828C']}

# ---- Stack models ---------------------------------------------------------------------------

# Single stacks a model cannot reach (a vanilla potion Wynncraft leaves alone, a model shared with
# others):
# - item: the stack's item model, an item id.
# - name: a pattern on its whole name.
# - model: the item id drawn instead.
# - part: the part it belongs to (items by default).
# Besides the rows, an Avomod model with no stub of its own gives way to the plain item, so
# Wynncraft's own definition draws the stack, as without Avomod.
stack_models:
  - {item: 'minecraft:splash_potion', name: 'Active Blesses', model: 'minecraft:nether_star'}
  - {item: 'minecraft:tripwire_hook', name: '.+ \[Lv\. \d+\]', model: 'minecraft:totem_of_undying'}
  - {item: 'minecraft:potion', name: '.*(Butterfly Buckler|Router Shield).*', model: 'minecraft:shield', part: crafting}

# ==== Screens ================================================================================

# Read while the game draws, and only while the retro pack is drawn.

# ---- Container titles -----------------------------------------------------------------------

# Wynntils container class pattern -> the title drawn instead of Wynncraft's, or keep (its label
# and background stay). Wynncraft's glyph titles also draw the ornate background, so a plain title
# leaves vanilla's. With no row, the readable text of Wynncraft's title is drawn, failing that a
# glyph_titles row, failing that Wynncraft's label.
container_titles:
  'AccountBankContainer': 'Account Bank'
  'CharacterBankContainer': 'Character Bank'
  'MiscBucketContainer': 'Misc. Bucket'
  'BookshelfContainer': 'Bookshelf'
  'PersonalBlockBankContainer': 'Block Bank'
  'IslandBlockBankContainer': 'Island Block Bank'
  'TradeMarketContainer': 'Trade Market'
  'TradeMarketBuyContainer': 'Trade Market: Buy'
  'TradeMarketSellContainer': 'Trade Market: Sell'
  'TradeMarketOrderContainer': 'Trade Market: Order'
  'TradeMarketFiltersContainer': 'Trade Market: Filters'
  'TradeMarketTradesContainer': 'Trade Market: Trades'
  'BlacksmithSellContainer': 'Blacksmith: Sell'
  'BlacksmithRepairContainer': 'Blacksmith: Repair'
  'ItemIdentifierContainer': 'Item Identifier'
  'ItemIdentifierAugmentsContainer': 'Add Augments'
  'MountFeederContainer': 'Mount Feeder'
  'CharacterInfoContainer': 'Character Info'          # the compass menu
  # Wynncraft's content book; Wynntils' own opens only with shift held (wynntils_config).
  'ContentBookContainer': 'Content Book'
  'MasteryTomesContainer': 'Mastery Tomes'
  # Screens that are their art: the ability tree, its reset and aspects, and the store.
  'AbilityTree(Reset)?Container|AspectsContainer': keep
  'Store(Page)?Container': keep

# ---- Glyph titles ---------------------------------------------------------------------------

# Glyph of Wynncraft's interface font (four hex digits) -> the title drawn on a screen whose title
# has it and no readable text, and that has no container_titles row.
glyph_titles:
  'E01A': 'Powder Master: Infuse'
  'E01B': 'Powder Master: Remove'
  'E01C': 'Powder Master: Upgrade'
  'E006': 'Merchant'
  'E03D': 'Party Finder: Create'
  'E03E': 'Party Finder: Join'
  'E03F': 'Party Finder: Queue'
  'E040': 'Party Finder: Search'
  'E028': 'Scavenger: Merchant'
  'E029': 'Scavenger: Tinker'
  'E05B': 'Item Upgrader'
  'E05C': 'Item Upgrader: Ascension'
  'E05D': 'Item Upgrader: Pouches'
  'E05E': 'Item Upgrader: Powder Upgrade'
  'E05F': 'Item Upgrader: Powder Remove'
  'E061': 'Mount Settings'
  # The crafting stations, which share one Wynntils class.
  'F041': 'Alchemism'
  'F042': 'Armouring'
  'F043': 'Cooking'
  'F044': 'Jeweling'
  'F045': 'Scribing'
  'F046': 'Tailoring'
  'F047': 'Weaponsmithing'
  'F048': 'Woodworking'

# ---- Slot fills -----------------------------------------------------------------------------

# Slots that are not the player's to fill: glass under their item; empty or holding Wynncraft's
# filler, they take no mouse. Rows apply on the inventory and on containers whose title retro draws;
# every row that applies paints, and where two pick a slot the first one's glass shows. On a
# Wynntils full-screen view only rows naming its class apply. A row is one of:
# - {player: wynntils}: the player's slots Wynntils names (compass, content book and pouch on white
#   glass, accessories under a white edge).
# - {container: <class pattern>, ...} or {title: <title pattern, as retro draws it>, ...}, with:
#   rows, cols (0 the top left); slots (a list counted across then down; outside_bounds, outside
#   what Wynntils bounds as the container's items; or all); except (slots never painted); unless
#   (a pattern on the class or title: containers skipped); fallback: true (only where no row above
#   applied); glass (clear, or a dye's colour as its pane's id spells it: white by default); open:
#   true (its slots still take the mouse while empty). Lists take numbers and ranges ('45-53'). On
#   a full-screen view, slots past the chest's own pick the part below it, which holds Wynncraft's
#   buttons: the inventory's three rows, then the hotbar.
# White under a button, grey on the rest, lime under the item traded, clear (and open) under the
# slot the player's item goes in; slots the player fills stay plain.
slot_fills:
  - {player: wynntils}
  - {container: '((Account|Character|PersonalBlock|IslandBlock)Bank|Bookshelf|MiscBucket)Container', slots: [45, 53], glass: gray}
  - {container: '((Account|Character|PersonalBlock|IslandBlock)Bank|Bookshelf|MiscBucket)Container', slots: outside_bounds}
  # The item on sale (22), its price (28) and quantity (31), which the player sets, and the buttons.
  - {container: 'TradeMarket(Buy|Sell)Container', slots: [22], glass: lime}
  - {container: 'TradeMarket(Buy|Sell)Container', slots: [28, 30, 31, 32, 34, '46-52']}
  - {container: 'TradeMarket(Buy|Sell)Container', slots: all, glass: gray}
  - {container: 'TradeMarketOrderContainer', slots: [28], glass: lime}
  - {container: 'TradeMarketOrderContainer', slots: ['46-52']}
  - {container: 'TradeMarketOrderContainer', slots: all, except: ['21-25', '30-34'], glass: gray}
  - {container: 'TradeMarketFiltersContainer', slots: [12, 21, 30, '46-52']}
  - {container: 'TradeMarketFiltersContainer', slots: [3, 39, 45, 53], glass: gray}
  - {container: 'TradeMarketTradesContainer', slots: ['46-52']}
  - {container: 'TradeMarketTradesContainer', rows: [0, 4, 5], cols: [0, 8], glass: gray}
  - {container: 'TradeMarketContainer', rows: [5]}                  # the buttons under the listings
  - {container: 'TradeMarketRevealItemsContainer', slots: [8]}      # the checkmark
  - {container: '(BlacksmithSell|ItemIdentifier(Augments)?)Container', slots: [17, 18]}
  - {container: 'BlacksmithRepairContainer', slots: [18]}
  - {container: '(Blacksmith(Repair|Sell)|ItemIdentifier)Container', slots: outside_bounds, glass: gray}
  # Wynntils bounds the augments view at 11 alone; 13-15 stay slots too.
  - {container: 'ItemIdentifierAugmentsContainer', slots: outside_bounds, except: ['13-15'], glass: gray}
  - {container: 'GuildBankContainer', cols: [0, 1]}
  - {container: 'GuildManagementContainer', cols: [0, 1, 7, 8]}
  - {container: 'MountFeederContainer', cols: [1], glass: gray}     # the divider
  # Character Info: its buttons white, the rows above and below the skill books clear.
  - {container: 'CharacterInfoContainer', slots: [7, 8, 9, 16, 17, 25, 26]}
  - {container: 'CharacterInfoContainer', slots: ['2-6', '20-24'], glass: clear}
  - {container: 'CharacterInfoContainer', slots: all, except: ['11-15'], glass: gray}   # but the skill books
  # The content book, a Wynntils full-screen view: its entries stay slots, and Wynncraft's buttons
  # fill the part below (54-80 the inventory's rows, 81-89 the hotbar).
  - {container: 'ContentBookContainer', slots: [58, '65-69']}
  - {container: 'ContentBookContainer', slots: ['54-89'], glass: gray}
  # The mastery tomes: the back button white, the tomes' ring of slots plain.
  - {container: 'MasteryTomesContainer', slots: [45]}
  - {container: 'MasteryTomesContainer', slots: all, except: [4, 11, 15, 19, 22, 25, 28, '30-32', 34, 38, 42, 49], glass: gray}
  - {title: 'Merchant', slots: [4]}
  - {title: 'Merchant', rows: [0], cols: [0, 8], glass: gray}
  # The item pedestal: its item a slot, its sign white.
  - {title: 'Item Pedestal', slots: [5]}
  - {title: 'Item Pedestal', slots: all, except: [3], glass: gray}
  # The Powder Master: its buttons white, the item's slot clear and open for the item, the powders'
  # slots plain.
  - {title: 'Powder Master: (Infuse|Remove|Upgrade)', slots: [0, 9, 17, 18]}
  - {title: 'Powder Master: Infuse', slots: [11], glass: clear, open: true}
  - {title: 'Powder Master: Remove', slots: [13], glass: clear, open: true}
  - {title: 'Powder Master: Upgrade', slots: [15], glass: clear, open: true}
  - {title: 'Powder Master: Infuse', slots: all, except: ['12-15'], glass: gray}
  - {title: 'Powder Master: Remove', slots: all, glass: gray}
  - {title: 'Powder Master: Upgrade', slots: all, except: ['11-14'], glass: gray}
  - {title: 'Powder Master.*', rows: [0, 2], cols: [0, 8]}
  # Housing: the islands' own buttons white.
  - {title: 'Housing Islands', slots: ['10-16']}
  - {title: 'Housing Islands', rows: [0, 2], cols: [0, 8], glass: gray}
  - {title: 'Available Islands', slots: [0, 10, 19, 27, 28, 36]}
  - {title: 'Available Islands', cols: [0, 1], glass: gray}
  - {title: 'Housing Master', slots: ['10-14', 16, 21]}
  - {title: 'Housing Master', slots: all, glass: gray}
  # The housing block lists ("Decoration Type Blocks" and the rest): the page arrows white.
  - {title: '.+ Type Blocks', slots: [0, 8]}
  - {title: '.+ Type Blocks', cols: [0, 8], glass: gray}
  - {title: 'Scavenger: Merchant', rows: [5]}
  - {title: 'Scavenger: Tinker', slots: [52], glass: clear, open: true}
  - {title: 'Scavenger: Tinker', cols: [0, 8], slots: [51], glass: gray}
  - {title: 'Scavenger: Tinker', rows: [0, 1, 2, 3, 4]}
  # The item upgrader: white on the seven marks of its table.
  - {title: 'Item Upgrader', slots: [10, 12, 14, 16, 20, 22, 24]}
  - {title: 'Item Upgrader', slots: all, glass: gray}
  # Its views: the item's slot clear and open, the others plain; Ascension's gem pink.
  - {title: 'Item Upgrader: (Ascension|Pouches)', slots: [11], glass: clear, open: true}
  - {title: 'Item Upgrader: Powder Upgrade', slots: [15], glass: clear, open: true}
  - {title: 'Item Upgrader: Ascension', slots: [24], glass: pink}
  - {title: 'Item Upgrader: Ascension', slots: ['2-6']}
  - {title: 'Item Upgrader: .+', slots: [17, 18]}
  - {title: 'Item Upgrader: Ascension', slots: all, except: ['12-15', '21-23'], glass: gray}
  - {title: 'Item Upgrader: Pouches', slots: all, except: ['12-15', '21-24'], glass: gray}
  - {title: 'Item Upgrader: Powder Upgrade', slots: all, except: ['11-14'], glass: gray}
  - {title: 'Item Upgrader: Powder Remove', slots: all, except: [13], glass: gray}
  # Mount settings: white on the three marks of its panel.
  - {title: 'Mount Settings', slots: [11, 13, 15]}
  - {title: 'Mount Settings', slots: all, glass: gray}
  - {title: 'Party Finder: .*', rows: [5]}
  - {title: 'Party Finder: .*', rows: [0, 4], cols: [0, 8], glass: gray}
  # The crafting stations, three rows (Wynncraft's art reaches over the inventory below): 13 is the
  # checkmark.
  - {container: 'CraftingStationContainer', slots: [10, 13]}
  - {container: 'CraftingStationContainer', slots: [1, 4, 18, 19, 22], glass: gray}
  # A player trade, titled with the two names far apart: both checkmarks white, the centre column
  # grey.
  - {title: '\S+ {4,}\S+', slots: [5, 21]}
  - {title: '\S+ {4,}\S+', cols: [4], glass: gray}
  # Every other titled screen, but those whose empty slots take the player's things.
  - {title: '.*', slots: all, fallback: true, unless: '(IngredientPouch|EmeraldPouch|ScrapMenu|LootChest|FlyingChest|DailyReward|ChallengeReward|ObjectiveReward|ItemBombReward|IngredientBombReward|Event)Container'}

# ---- Slot values ----------------------------------------------------------------------------

# Values Wynncraft prints in a title retro replaces, drawn in their button's slot instead, on the
# containers retro titles:
# - container: a class pattern.
# - name: the button's exact item name.
# - lore: a pattern found anywhere in a lore line; its first group is the value.
slot_values:
  - {container: 'TradeMarket(Buy|Sell|Order)Container', name: 'Set Amount', lore: 'Current: ([\d,]+)'}

# ---- Hidden inventory effects ---------------------------------------------------------------

# Effect id pattern: effects the inventory leaves out while they last forever, as a weapon's attack
# speed does (an endless haste or mining fatigue).
hidden_inventory_effects:
  - 'minecraft:(haste|mining_fatigue)'

# ==== Wynntils settings ======================================================================

# Feature -> setting -> value, as "/wynntils config set" takes them, while retro is on; each goes
# back after, unless changed by hand since. One this Wynntils lacks is skipped with a warning.
wynntils_config:
  'ItemHighlight':
    'highlightTexture': 'tag'                         # its tag, not Wynncraft's ornate frame
  'CustomPlayerListOverlay':
    'userEnabled': 'false'                            # vanilla's player list
  # Its icon on a gear box would sit on retro's (gear_box_icons); there is no "none" texture.
  'UnidentifiedItemIcon':
    'userEnabled': 'false'
  # Its jump bar would cover vanilla's (same_name); the feature arrived in Wynntils 4.2.11.
  'MountJumpBar':
    'userEnabled': 'false'
  # Its content book only with shift held, so Wynncraft's opens (container_titles); its keys stay.
  'WynntilsContentBook':
    'shiftBehaviorConfig': 'enabledIfShiftHeld'

# ==== Parts ==================================================================================

# Part -> what /wv retro parts can turn off; every part is on until then, and an off part looks as
# if retro were not installed, but for art an on part draws too. Every RetroPart needs a row, in
# its order:
# - about: what /wv retro parts says.
# - textures, models: patterns; the first row whose pattern matches an id owns it, and an id no row
#   owns stays on.
# - wynntils: the wynntils_config features it owns.
# What a part draws from code gates on it.
parts:
  # Blocks drawn from entity/ textures too (a shulker box's folder is the shulker's).
  blocks:
    about: 'Blocks in the world, signs, beds, banners, chests and paintings among them'
    textures:
      - 'minecraft:block/.*'
      - 'minecraft:painting/.*'
      - 'minecraft:entity/(banner|bed|bell|chest|conduit|decorated_pot|shulker|signs)/.*'
      - 'minecraft:entity/(banner_base|beacon_beam|enchanting_table_book|end_gateway_beam|end_portal)'
    models: ['minecraft:block/.*']
  # The worn layers are armour's, but for the llama's decor, drawn with its body (layer_groups).
  mobs:
    about: 'Mobs, animals and other entities'
    textures:
      - 'minecraft:entity/equipment/llama_body/.*'
      - 'minecraft:entity/(?!equipment/).*'
  weapons:
    about: 'Weapons and their skins, in the hand and in slots'
    models: ['minecraft:item/wynn/(weapon|skin)/.*']
  armour:
    about: 'Armour icons, and armour worn by mobs and stands'
    models: ['minecraft:item/wynn/armor/.*']
    textures:
      - 'minecraft:entity/equipment/.*'
      - 'minecraft:misc/enchanted_glint_armor'
  # Only what code draws (accessory_tiers); an empty slot's placeholder is screens'.
  accessories:
    about: 'Rings, bracelets and necklaces, by level'
  tools:
    about: 'Profession tools'
    models: ['minecraft:item/wynn/tool/.*']
  # Also Avomod's models of crafted scrolls and food, which give way to Wynncraft's (stack_models).
  crafting:
    about: 'Ingredients, materials, meals and papers'
    models:
      - 'minecraft:item/wynn/(ingredient|economy)/.*'
      - 'avomod2:item/(scroll|food)_.*'
  potions:
    about: 'Potions, of Wynncraft and of Avomod'
    models:
      - 'minecraft:item/wynn/potion/.*'
      - 'avomod2:.*'
  gear_boxes:
    about: 'Unidentified gear boxes and mastery tomes'
    models:
      - 'minecraft:item/wynn/(gui/)?loot/.*'
      - 'minecraft:item/wynn/mastery_tome/.*'
    wynntils: ['UnidentifiedItemIcon']
  tooltips:
    about: 'Tooltip frames'
    textures: ['minecraft:gui/sprites/tooltip/.*']
  # Also lang, titles and backgrounds, slot values and the inert slots image_edits leaves. Under
  # gui/, highlights has the tier layer and items the content book.
  screens:
    about: "Container art, titles, buttons and menu names, Wynntils' panels and the main menu's panorama"
    textures:
      - 'minecraft:gui/container/.*'
      - 'minecraft:gui/sprites/widget/.*'
      - 'minecraft:gui/sprites/container/slot/.*'
      - 'minecraft:gui/title/background/.*'
      - 'minecraft:wynn/gui/slot/.*'
      - 'wynntils:.*'
    models: ['minecraft:item/wynn/gui/(?!layer/tier/|player/).*']
    wynntils: ['WynntilsContentBook']
  # slot_fills; on a container it needs screens, which draws the title the fills key on.
  glass:
    about: 'Glass on the slots that are not yours to fill'
  highlights:
    about: 'How an item in a slot shows its rarity'
    models: ['minecraft:item/wynn/gui/layer/tier/.*']
    wynntils: ['ItemHighlight']
  # With it off, Wynncraft's action bar stays whole.
  hud:
    about: "Vanilla's hearts, food, armour, air and experience bar for Wynncraft's"
    textures: ['minecraft:gui/sprites/hud/.*']
    wynntils: ['MountJumpBar']
  # Also hidden_inventory_effects.
  effects:
    about: 'Effect icons, and no endless Attack Speed beside the inventory'
    textures: ['minecraft:mob_effect/.*']
  player_list:
    about: "Vanilla's player list instead of Wynntils'"
    wynntils: ['CustomPlayerListOverlay']
  # The catch-alls, last.
  items:
    about: 'Every other item: keys, scrolls, mounts, runes, wards, powders...'
    models: ['minecraft:item/wynn/.*']
    textures: ['minecraft:item/.*']
