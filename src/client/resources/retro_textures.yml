  paper:
    models: 'minecraft:item/wynn/economy/woodcutting/paper_'
    paper: {oak: '#9C7F4E', birch: '#C3B37B', acacia: '#A95B33', spruce: '#674D2E',
            jungle: '#9A6E4D', dark: '#3D2712', light: '#BEBEBE', sky: '#2B6863', dernic: '#653046',
            redwood: '#753630', willow: '#4B5C39', avo: '#C1AD50', pine: '#473928',
            maple: '#E2B2AC'}

# ---- Content book activities ---------------------------------------------------------------

# The content book's activities, one art each near the colour Wynncraft gave it, which become rows
# of item_models and source_copies, tried before their own. The table has:
# - models: what the book's model ids start with.
# - states: state -> how the art looks in it, as a recipe's scale_from or hue_of with the colour
#   it takes. Each activity gets a copy at vetsmod:item/retro/book/<activity>_<state> for its model
#   <activity>_<state>.
# - activities: name -> its art, which its model <activity>_active draws as it is.
# Tracked and locked are the art made brighter and dimmer, as Wynncraft pulses the one and pales the
# other. A new activity is one row of activities. The book's other buttons (filter, sort, progress)
# stay Wynncraft's, but for the few in item_models.
content_book_activities:
  models: 'minecraft:item/wynn/gui/content_book/'
  states:
    tracked: {scale_from: '#808080', colour: '#FFFFFF'}
    locked: {colour: '#707070'}
  activities:
    quest: 'minecraft:item/lime_dye'
    story_quest: 'minecraft:item/green_dye'
    mini_quest: 'minecraft:item/purple_dye'
    world_event: 'minecraft:item/cyan_dye'
    discovery: 'minecraft:item/light_blue_dye'
    cave: 'minecraft:item/orange_dye'
    dungeon: 'minecraft:item/pink_dye'
    raid: 'minecraft:item/red_dye'
    boss_altar: 'minecraft:item/yellow_dye'
    loot_camp: 'minecraft:item/lapis_lazuli'
    time_trial: 'minecraft:item/magenta_dye'
    mount_enclosure: 'minecraft:item/cocoa_beans'

# ---- Potions -------------------------------------------------------------------------------

# Potion family -> the colour of its liquid, and the name of Avomod's model of it if it has one.
# A row covers Wynncraft's item/wynn/potion/<family>_<empty|half|full>, and avomod2:item/<avomod>
# when Avomod is installed. The retro pack overrides each with the vanilla potion: its liquid, the
# potion_overlay recipe in that colour at vetsmod:item/retro/potion/<family>, under the bottle
# (item/potion), on a parent no stack colour reaches. All three of a family are full of liquid in Wynncraft's own art ("empty" is not an
# empty bottle: a Potion of Dexterity [1/2] draws dexterity_empty), so each is the full vanilla
# potion. Avomod names its models itself, with its own spelling of defence. A family with no row
# keeps its model.
# The colours: the skill point colours for the five skill potions, vanilla's effect colours
# for healing (instant health), wisdom (luck) and drunkness (nausea), and a vanilla-like blue
# for mana. A new family:
#   luck: {colour: '#33AA33'}
potions:
  strength: {colour: '#00AA00', avomod: potion_sp_strength}
  dexterity: {colour: '#FFFF55', avomod: potion_sp_dexterity}
  intelligence: {colour: '#55FFFF', avomod: potion_sp_intelligence}
  defense: {colour: '#FF5555', avomod: potion_sp_defence}
  agility: {colour: '#FFFFFF', avomod: potion_sp_agility}
  healing: {colour: '#F82423', avomod: potion_health}
  mana: {colour: '#385DC6', avomod: potion_mana}
  wisdom: {colour: '#59C106'}
  drunkness: {colour: '#551D4A'}

# ---- Equipment -----------------------------------------------------------------------------

# Equipment asset pattern -> the vanilla asset whose file replaces Wynncraft's, or keep. An
# equipment asset (equipment/<name>.json) says how worn armour is drawn: which textures under
# entity/equipment/ each layer takes, and whether the stack's dye tints them. Wynncraft's make
# every layer dyeable and give its own materials textures of their own, so a texture rule
# alone cannot draw them as vanilla's; vanilla's file, copied as it is, draws vanilla's layers
# (which same_name gives their 2013 art) with vanilla's dyeing. Worn armour shows on armour
# stands and other mobs; a player's own armour is drawn through minecraft:hidden. A Wynncraft
# asset with no row keeps its own file, as with keep; each material of Wynncraft's own stays
# so until someone works out its 2013 look.
equipment:
  'minecraft:hidden': keep                            # the player's own armour: drawn invisible
  'minecraft:(pale_)?leather': 'minecraft:leather'
  'minecraft:(pale_)?(chainmail|iron|gold|diamond|netherite)': 'minecraft:$2'
  # Titanium, Wynncraft's tier above diamond, as netherite, as its item does (item_models).
  'minecraft:(pale_)?titanium': 'minecraft:netherite'
  'minecraft:tan': keep
  'minecraft:shaman': keep
  'minecraft:(pale_)?copper': keep                    # no 2013 copper armour (keep_wynncraft)
  'minecraft:quartz': keep
  'minecraft:infernal': keep
  'minecraft:gendarme': keep
  'minecraft:phantom': keep
  'minecraft:wings': keep

# ---- Image edits ---------------------------------------------------------------------------

# Texture id (not a pattern) -> fills painted on its copy, in order. The texture must be one
# a rule above copies or tints in; its copy then always ships, even when Wynncraft does not
# repaint it.
# - fill: the rectangle painted.
# - sample: [x, y] of the pixel whose colour it is painted.
# - palette: the only colours the rectangle may hold. A rectangle holding any other, or a
#   translucent pixel, is left alone and the report lists it: the texture's layout has
#   changed, and the rectangle needs checking.
image_edits:
  # The inventory has no crafting grid, arrow, result slot or offhand slot (Wynncraft uses
  # none); they become the panel grey sampled beside the grid, and an inventory slot a fill
  # painted over takes no mouse. Wynncraft blanks the "Crafting" label itself (lang never
  # restores it).
  'minecraft:gui/container/inventory':
    - fill: [97, 17, 74, 36]    # the 2x2 grid, the arrow and the result slot
      sample: [172, 17]
      palette: ['#C6C6C6', '#8B8B8B', '#373737', '#FFFFFF']
    - fill: [76, 61, 18, 18]    # the offhand slot
      sample: [172, 17]
      palette: ['#C6C6C6', '#8B8B8B', '#373737', '#FFFFFF']

# ---- Copies of Wynncraft's textures --------------------------------------------------------

# vetsmod texture id -> the texture copied there, with its .mcmeta, as the packs below retro show
# it (Wynncraft's, or the lower packs' when Wynncraft ships none), before the rules above replace
# it. The copies are in vetsmod's namespace, so they hide nothing.
wynncraft_copies:
  # Wynntils' tag highlight, for Wynncraft's tier layer (item_models), read from the player's
  # own Wynntils.
  'vetsmod:item/retro/tier_tag': 'wynntils:ui_components/sprites/highlight_tag'
  # The gold LEGACY tooltip border is Wynncraft's unique style, which the tooltip alias turns
  # vanilla; the legacy items keep it as the vetsmod:legacy style.
  'vetsmod:gui/sprites/tooltip/legacy_background': 'minecraft:gui/sprites/tooltip/unique_background'
  'vetsmod:gui/sprites/tooltip/legacy_frame': 'minecraft:gui/sprites/tooltip/unique_frame'
  # The container backgrounds same_name turns vanilla. A container that keeps Wynncraft's label
  # (container_titles) is drawn on Wynncraft's own background again, from these copies, so the
  # art its label draws sits on the texture it was made for.
  'vetsmod:gui/container/wynncraft/generic_54': 'minecraft:gui/container/generic_54'
  'vetsmod:gui/container/wynncraft/hopper': 'minecraft:gui/container/hopper'
  'vetsmod:gui/container/wynncraft/horse': 'minecraft:gui/container/horse'

# ---- Copies of the sources' textures -------------------------------------------------------

# vetsmod texture id -> the texture copied there from its sources, as a copy is read (the
# first pack of its sources row that has it), with the .mcmeta beside it: art a stub needs at
# an id of its own, because a rule above keeps the original as Wynncraft's, or because it lives
# in a folder no item atlas takes, and GUI sprites the HUD draws by id. The atlases stitch a copy
# as they stitch any pack's texture (a block/ copy into the blocks atlas, an item/ copy into the
# items atlas, a gui/sprites/ copy into the GUI's), and the copies are in vetsmod's namespace, so
# they hide nothing. materials, content_book_activities and potions make rows of this section
# too; a row here may not repeat one. A row is one of:
# - a texture id: the file as it is.
# - {<recipe>: '#RRGGBB'}: the recipe's art in that colour (recipes).
source_copies:
  # The keys' tripwire hook (item_models): keep_wynncraft keeps block/tripwire_hook itself.
  'vetsmod:block/retro/tripwire_hook': 'minecraft:block/tripwire_hook'
  # The ability shard's liquid (vetsmod:item/retro/ability_shard): the colour of the shard's name.
  'vetsmod:item/retro/ability_shard_liquid': {potion_overlay: '#82EFF4'}
  # The raptor's and the wyvern's saddles (item_models).
  'vetsmod:item/retro/saddle_red': {saddle: '#C8241C'}
  'vetsmod:item/retro/saddle_white': {saddle: '#E9E9E9'}
  # The Horse Whistle's horse armour (vetsmod:item/retro/leather_horse_armor): vanilla's art is
  # grey and its item definition dyes it this colour; a white stack would leave it grey.
  'vetsmod:item/retro/leather_horse_armor_dyed': {leather_horse_armor: '#A06540'}
  # The gear boxes' chest (vetsmod:item/retro/chest), an entity texture, into the blocks atlas.
  # Programmer Art 1.21.11 has no normal chest (only the ender chest), so until a source has
  # the 2013 one this is today's vanilla chest.
  'vetsmod:block/retro/chest': 'minecraft:entity/chest/normal'
  # Store & Wardrobe's ender chest (vetsmod:item/retro/ender_chest), likewise.
  'vetsmod:block/retro/ender_chest': 'minecraft:entity/chest/ender'
  # The plants item_models draws green, in the colours vanilla gives its own items: the vine's
  # and the lily pad's constants, and the grass colour of its fern, grass and grass block
  # (vanilla's colormap/grass.png at their temperature 0.5 and downfall 1.0).
  'vetsmod:block/retro/green/vine': {vine: '#48B518'}
  'vetsmod:block/retro/green/lily_pad': {lily_pad: '#71C35C'}
  'vetsmod:block/retro/green/fern': {fern: '#7CBD6B'}
  'vetsmod:block/retro/green/large_fern_top': {large_fern_top: '#7CBD6B'}
  'vetsmod:block/retro/green/short_grass': {short_grass: '#7CBD6B'}
  'vetsmod:block/retro/green/grass_block_top': {grass_block_top: '#7CBD6B'}
  'vetsmod:block/retro/green/grass_block_side_overlay': {grass_block_side_overlay: '#7CBD6B'}
  # Overhealth (RetroHud): the hearts drawn over the red ones, a colour for each row of it, the
  # way Tinkers' Construct's heart canisters stack.
  'vetsmod:gui/sprites/retro/heart/orange_full': {heart_full: '#FF8C13'}
  'vetsmod:gui/sprites/retro/heart/orange_half': {heart_half: '#FF8C13'}
  'vetsmod:gui/sprites/retro/heart/yellow_full': {heart_full: '#FFE213'}
  'vetsmod:gui/sprites/retro/heart/yellow_half': {heart_half: '#FFE213'}
  'vetsmod:gui/sprites/retro/heart/green_full': {heart_full: '#13D813'}
  'vetsmod:gui/sprites/retro/heart/green_half': {heart_half: '#13D813'}

# ---- Wynntils textures ---------------------------------------------------------------------

# wynntils texture id -> what is drawn in its place, at the size Wynntils' own texture has:
# - blank: fully transparent.
# - a list of frames, stacked top to bottom, each an equal share of the height (Wynntils
#   draws a button's normal frame over its hovered one). A frame stretches a region of a
#   vanilla texture the way Minecraft draws a nine-slice GUI sprite:
#   - source: the texture id.
#   - region (optional): the rectangle used; the whole texture without one.
#   - border: the width of the corners and edges, which are copied; the middle is tiled.
wynntils_textures:
  # The background of the emerald counts beside containers.
  'wynntils:ui_components/emerald_count_background': blank
  # The bank's page panel: a plain vanilla panel (the demo screen's, the same bevel as a
  # container's).
  'wynntils:ui_components/bank_panel':
    - {source: 'minecraft:gui/demo_background', region: [0, 0, 248, 166], border: 4}
  # The bank's quick-jump buttons: vanilla buttons, normal over highlighted.
  'wynntils:ui_components/quick_jump_button':
    - {source: 'minecraft:gui/sprites/widget/button', border: 3}
    - {source: 'minecraft:gui/sprites/widget/button_highlighted', border: 3}

# ---- Blank textures ------------------------------------------------------------------------

# Textures of Wynncraft's written fully transparent, at their own size: art it draws where vanilla's
# goes, with no row of its own to take it out.
blank_textures:
  # The jump meter, under vanilla's jump bar (same_name).
  - 'minecraft:font/hud/gameplay/default/bottom_middle/jump_bar'

# ---- Language ------------------------------------------------------------------------------

# locales: the language codes a file is written for. strings: translation key -> text, written
# into each of them. Wynncraft blanks or renames
# these in the five English locales it ships; the retro pack, above it, restores vanilla's.
# container.inventory is blanked again on a container that keeps Wynncraft's label
# (container_titles), whose art covers it. Never restore container.crafting: the inventory has
# no crafting grid (image_edits).
lang:
  locales: ['en_us', 'en_gb', 'en_ca', 'en_au', 'en_nz']
  strings:
    'container.inventory': 'Inventory'
    'menu.returnToGame': 'Back to Game'
    'menu.game': 'Game Menu'

# ---- Outlined icons ------------------------------------------------------------------------

# Overlays that need an outline of their own to read over what they are drawn on: Wynntils' gear or
# tome type -> the texture of the icon. Each group sets:
# - scale: the art's size, as a share of the slot.
# - outline: the dark outline round it: pixels, how many of the art's pixels thick it is, and
#   colour.
# The pack redraws the art with its outline as a texture, a model and an item definition at
# vetsmod:retro/icon/<type>. A type here takes precedence over gear_box_icons (below).
outlined_icons:
  # An unidentified weapon, over its box's chest.
  - scale: 0.625
    outline: {pixels: 1, colour: '#191919'}
    art:
      'SPEAR': 'minecraft:item/iron_shovel'
      'WAND': 'minecraft:item/stick'
      'DAGGER': 'minecraft:item/shears'
      'BOW': 'minecraft:item/bow'
      'RELIK': 'minecraft:item/bone'
  # A mastery tome, over its glinting book. The Allegiance tome's shield has no flat art (a special
  # renderer draws it), so it is the real item, in gear_box_icons.
  - scale: 0.375
    outline: {pixels: 3, colour: '#191919'}
    art:
      'ARMOUR_TOME': 'minecraft:item/iron_helmet'
      'WEAPON_TOME': 'minecraft:item/iron_sword'
      'MARATHON_TOME': 'minecraft:item/iron_boots'
      'EXPERTISE_TOME': 'minecraft:item/iron_hoe'
      'MYSTICISM_TOME': 'minecraft:item/arrow'
      'LOOTRUN_TOME': 'minecraft:block/tripwire_hook'

# ---- Accessory tiers -----------------------------------------------------------------------

# Rings, bracelets and necklaces show their level as armour shows it. art: Wynntils' gear type ->
# Wynncraft's texture every accessory of that type is drawn from. tiers: lowest level first, each
# up to but not including its below, the last with none. A tier's ramp is the colours the art's
# brightness runs through, evenly from black to white; a pixel darker than outline_below_luma, a
# brightness from 0 to 255, becomes the grey of its brightness, so the art's outline and first
# shade are the near-black and dark grey the armour icons start from, in every tier. Each type and
# tier becomes a texture, a model and an item definition at vetsmod:retro/accessory/<type>_<tier>,
# which a stack Wynntils knows the level of is drawn with; a stack it does not know stays
# Wynncraft's. Each type also becomes <type>_empty, the art's outline in the colour of
# empty_outline, a dark grey that reads on the slot, for its empty slot (item_models), with the
# pixels inside it darker than empty_lines_below_luma in that colour too: the bracelet's inner
# circle, which its art only shades.
accessory_tiers:
  outline_below_luma: 64
  empty_outline: '#373737'
  empty_lines_below_luma: 30
  art:
    'RING': 'minecraft:wynn/accessory/ring_purity'
    'BRACELET': 'minecraft:wynn/accessory/bracelet_base'
    'NECKLACE': 'minecraft:wynn/accessory/necklace_base'
  tiers:
    - {name: leather, below: 20, ramp: ['#1C0E06', '#5B3419', '#8E5A33', '#B98055', '#E2B48C']}
    - {name: gold, below: 40, ramp: ['#3A2500', '#A8730A', '#E0B420', '#F8E050', '#FFFBC0']}
    - {name: chainmail, below: 60, ramp: ['#101010', '#3C3C3C', '#6A6A6A', '#969696', '#C8C8C8']}
    - {name: iron, below: 80, ramp: ['#202020', '#6E6E6E', '#A8A8A8', '#D8D8D8', '#FFFFFF']}
    - {name: diamond, below: 100, ramp: ['#06302C', '#147A70', '#2CCDB1', '#6FF0DC', '#D8FFF8']}
    - {name: netherite, ramp: ['#0C0A0C', '#2C282C', '#463F46', '#625A62', '#8C828C']}

# ---- Block models ---------------------------------------------------------------------------

# Block models Wynncraft remakes, drawn from another model instead: the block model to the model
# it becomes. Wynncraft's redstone torches are its own candles, on a holder when they are on a
# wall. Vanilla's candle has no wall form, so vetsmod's stands where a wall torch does.
block_models:
  'minecraft:block/redstone_torch': 'minecraft:block/candle_one_candle_lit'
  'minecraft:block/redstone_torch_off': 'minecraft:block/candle_one_candle'
  'minecraft:block/redstone_wall_torch': 'vetsmod:block/retro/wall_candle_lit'
  'minecraft:block/redstone_wall_torch_off': 'vetsmod:block/retro/wall_candle'

# ==== Screens and settings ==================================================================

# The sections below write no files (but for gear_box_icons' item definitions). The game reads
# them while it draws, and only while the retro pack is drawn, so nothing here paints
# over art retro did not replace; wynntils_config applies while retro is on and not stopped.

# ---- Container titles ----------------------------------------------------------------------

# Wynntils container class -> the title drawn on that container, or keep. Wynncraft writes
# most container titles as glyphs, which also draw the screen's ornate background; a plain
# title in their place leaves the vanilla container. The pattern matches the simple name of
# the class Wynntils' container model gives the open screen (AccountBankContainer, ...: the
# classes in Wynntils' models/containers/containers/). The first matching row decides:
# - a title: drawn in the label's place, in vanilla's label grey.
# - keep: Wynncraft's label, and the art it draws, stay, on Wynncraft's own container
#   background (wynncraft_copies).
# With no row, the readable part of Wynncraft's title is drawn: its text in the default font,
# without glyphs, spacing characters or formatting codes. With nothing readable, Wynncraft's
# label stays, as with keep. GuildMemberListContainer has no row: Wynntils knows it by its
# title text, "<guild>: Members", which the readable title keeps.
container_titles:
  'AccountBankContainer': 'Account Bank'
  'CharacterBankContainer': 'Character Bank'
  'MiscBucketContainer': 'Misc. Bucket'
  'BookshelfContainer': 'Bookshelf'
  'PersonalBlockBankContainer': 'Block Bank'
  'IslandBlockBankContainer': 'Island Block Bank'
  'TradeMarketContainer': 'Trade Market'
  'TradeMarketBuyContainer': 'Trade Market: Buy'
  'TradeMarketSellContainer': 'Trade Market: Sell'
  'TradeMarketOrderContainer': 'Trade Market: Order'
  'TradeMarketFiltersContainer': 'Trade Market: Filters'
  'TradeMarketTradesContainer': 'Trade Market: Trades'
  'BlacksmithSellContainer': 'Blacksmith: Sell'
  'BlacksmithRepairContainer': 'Blacksmith: Repair'
  'ItemIdentifierContainer': 'Item Identifier'
  'ItemIdentifierAugmentsContainer': 'Add Augments'
  'MountFeederContainer': 'Mount Feeder'
  # The compass menu: skill points, the ability tree and the other buttons.
  'CharacterInfoContainer': 'Character Info'
  # The content book, one of Wynntils' full-screen views: its entries in the chest, and
  # Wynncraft's buttons (scroll, filters) where the player's inventory would be. Wynntils' own
  # content book opens in its place only with shift held (wynntils_config).
  'ContentBookContainer': 'Content Book'
  # The ability tree, its reset and its aspects keep Wynncraft's art: the tree is its title's
  # glyphs and the items laid on them.
  'AbilityTree(Reset)?Container|AspectsContainer': keep
  # The store is its art: banners and offers laid out on the title's glyphs.
  'Store(Page)?Container': keep

# ---- Glyph titles ---------------------------------------------------------------------------

# Screens Wynntils has no class for, or one class for several, whose title is only glyphs. Each row
# is a glyph of Wynncraft's interface font, as four hex digits, and the title drawn on a screen
# whose title has it in that font, which also drops the art it drew. Other fonts reuse the same
# code points: the store's ribbon is E006 in its own.
glyph_titles:
  'E01A': 'Powder Master: Infuse'
  'E01B': 'Powder Master: Remove'
  'E01C': 'Powder Master: Upgrade'
  'E006': 'Merchant'
  'E03D': 'Party Finder: Create'
  'E03E': 'Party Finder: Join'
  'E03F': 'Party Finder: Queue'
  'E040': 'Party Finder: Search'
  # The crafting stations: one class for all, so their names come from these glyphs, the
  # font/interface/crafting/title.png Wynntils' CraftingStationContainer matches them by.
  'F041': 'Alchemism'
  'F042': 'Armouring'
  'F043': 'Cooking'
  'F044': 'Jeweling'
  'F045': 'Scribing'
  'F046': 'Tailoring'
  'F047': 'Weaponsmithing'
  'F048': 'Woodworking'

# ---- Slot fills ----------------------------------------------------------------------------

# Slots that are not the player's to fill freely. They show white glass, which keeps the slot in
# sight and says it is special, under their item if they have one. Holding nothing, or Wynncraft's
# filler (no tooltip, or a name with no letter or digit), they do not highlight or take a click.
# The player row's accessory slots, which take an accessory by click or drag, stay plain slots under
# a white edge instead. Rows apply on the inventory and on containers whose title retro draws
# (container_titles), never on a container that keeps Wynncraft's label and art, nor on Wynntils'
# full-screen views (the content book, the ability tree), even where retro draws their title:
# Wynncraft fills their player-inventory part with its own buttons, so the player's slots there are
# not the player's. Every row that applies paints its slots. Each row is one of:
# - {player: wynntils}: the player's own slots Wynntils names: the compass (7), the content
#   book (8), the accessories (9-12) and the ingredient pouch (13).
# - {container: <pattern>, ...}: slots of a container whose Wynntils class matches the
#   pattern, as in container_titles.
# - {title: <pattern>, ...}: slots of a container whose title, as retro draws it, matches the
#   pattern; for screens Wynntils does not name.
# A container row picks slots of a chest (9 columns, up to 6 rows) with any of:
# - rows: [r, ...], 0 the top.
# - cols: [c, ...], 0 the left.
# - slots: [n, ...], counted across then down from 0 at the top left; outside_bounds: every
#   slot outside the area Wynntils says holds the container's items; or all: every slot.
# - except: [n, ...], slots the row never paints: the slots the player fills or sets.
# - unless: <pattern>, containers the row skips, by Wynntils class or by title as retro draws it.
# - fallback: true, the row applies only to a container no row above it applied to, so a new row
#   above takes its screen out of the fallback by itself.
# Each list takes numbers and quoted ranges such as '45-53'. A new screen:
#   - {container: 'ScrapMenuContainer', rows: [5], except: [49]}
slot_fills:
  - {player: wynntils}
  - {container: '((Account|Character|PersonalBlock|IslandBlock)Bank|Bookshelf|MiscBucket)Container', slots: outside_bounds}
  - {container: 'TradeMarket(Buy|Sell)Container', slots: all, except: [22, 28, 31]}
  - {container: 'TradeMarketTradesContainer', rows: [0, 4, 5], cols: [0, 8]}
  # The market's listings are not blocked, only the buttons under them.
  - {container: 'TradeMarketContainer', rows: [5]}
  # The checkmark: the slots before it take what the player picks.
  - {container: 'TradeMarketRevealItemsContainer', slots: [8]}
  # Their bench is what Wynntils bounds; the rest is buttons and frame.
  - {container: '(Blacksmith(Repair|Sell)|ItemIdentifier(Augments)?)Container', slots: outside_bounds}
  # The guild bank's buttons are its two left columns; the rest is storage.
  - {container: 'GuildBankContainer', cols: [0, 1]}
  # The guild's management screen: its middle holds the buttons, on plain slots.
  - {container: 'GuildManagementContainer', cols: [0, 1, 7, 8]}
  # The Mount Feeder's second column only divides its mount's slots from its food's.
  - {container: 'MountFeederContainer', cols: [1]}
  # Character Info's skill point books, the one thing on it that is spent, are plain slots.
  - {container: 'CharacterInfoContainer', slots: all, except: ['11-15']}
  # A merchant's wares run from its second row to its last; the top and sides are frame.
  - {title: 'Merchant', rows: [0], cols: [0, 8]}
  # A pedestal's slots are the item it shows and its sign.
  - {title: 'Item Pedestal', slots: all, except: [3, 5]}
  # The same frame on three rows: the Powder Master's slots for an item and its powders, and the
  # islands, are in the middle.
  - {title: 'Housing Islands|Powder Master.*', rows: [0, 2], cols: [0, 8]}
  # A party finder's listings are the three rows from its second, seven wide; its buttons are below.
  - {title: 'Party Finder: .*', rows: [0, 4, 5], cols: [0, 8]}
  # A crafting station's checkmark: the slots it takes ingredients and materials in stay slots.
  - {container: 'CraftingStationContainer', slots: [13]}
  # A player trade, titled with the two names far apart: the sides stay slots; the centre column
  # and the checkmarks, 21 the other player's and 5 this one's, are not.
  - {title: '\S+ {4,}\S+', slots: [5, 21], cols: [4]}
  # Every other screen retro draws a title on, but those whose empty slots take the player's
  # things: the pouches and the reward chests.
  - {title: '.*', slots: all, fallback: true, unless: '(IngredientPouch|EmeraldPouch|ScrapMenu|LootChest|FlyingChest|DailyReward|ChallengeReward|ObjectiveReward|ItemBombReward|IngredientBombReward|Event)Container'}

# ---- Gear box icons ------------------------------------------------------------------------

# Wynntils gear type -> the vanilla item drawn over an unidentified gear box of that type, at
# three quarters of the slot, centred, in the inventory, containers and the hotbar. Every box
# is one chest (item_models), whatever its type, so this tells them apart, as Wynntils' own
# icons do (wynntils_config turns those off). The key is a name of Wynntils' GearType or
# TomeType (GUILD_TOME is a tome type); a type with no row gets no icon. The item is drawn from
# vanilla's item definition, which the pack copies under vetsmod's namespace, because Wynncraft's
# own definitions of some vanilla items draw its own items instead.
gear_box_icons:
  # The weapons are outlined_icons'. The armour: the iron pieces.
  'HELMET': 'minecraft:iron_helmet'
  'CHESTPLATE': 'minecraft:iron_chestplate'
  'LEGGINGS': 'minecraft:iron_leggings'
  'BOOTS': 'minecraft:iron_boots'
  # The accessories, which vanilla has no item for: a nugget for a ring, a lead looped as a
  # necklace, and a clock, worn on the wrist, for a bracelet.
  'RING': 'minecraft:gold_nugget'
  'NECKLACE': 'minecraft:lead'
  'BRACELET': 'minecraft:clock'
  # A mastery tome's shield: the real item (outlined_icons has the others, which are flat).
  'GUILD_TOME': 'minecraft:shield'

# ---- Stack models ---------------------------------------------------------------------------

# Single stacks whose look cannot be a model's: a vanilla potion Wynncraft leaves alone, or an
# item sharing its model with others (the guild's item shares the keys' tripwire hook). Each row
# needs item (the stack's item model), name (a pattern on its whole name, without formatting)
# and model (the item model drawn instead). part (optional) is the part it belongs to, items
# without one.
stack_models:
  - {item: 'minecraft:splash_potion', name: 'Active Blesses', model: 'minecraft:nether_star'}
  - {item: 'minecraft:tripwire_hook', name: '.+ \[Lv\. \d+\]', model: 'minecraft:totem_of_undying'}
  # Two ingredients as the real shield, whose item model alone draws nothing.
  - {item: 'minecraft:potion', name: '.*(Butterfly Buckler|Router Shield).*', model: 'minecraft:shield', part: crafting}

# ---- Slot values ---------------------------------------------------------------------------

# Values Wynncraft prints in a container's title, over a button it draws as nothing. Retro's
# title drops them, so the value is drawn in the button's slot instead: the first group of the
# lore pattern, found in the first lore line it matches, on an item of exactly that name. Each
# row needs container (a pattern on the Wynntils class), name and lore. Only on containers retro
# relabels. The Buy view's amount is seen in game; the Sell and Order views are assumed to match.
slot_values:
  - {container: 'TradeMarket(Buy|Sell|Order)Container', name: 'Set Amount', lore: 'Current: ([\d,]+)'}

# ---- Hidden inventory effects --------------------------------------------------------------

# Effect id pattern: effects the inventory's effect list leaves out while they last forever.
# Wynncraft shows a weapon's attack speed as an endless haste or mining fatigue, which the list
# shows as "Attack Speed" with an infinite time; a haste that runs out still shows.
hidden_inventory_effects:
  - 'minecraft:(haste|mining_fatigue)'

# ---- Wynntils settings ---------------------------------------------------------------------

# Wynntils feature -> setting -> value, in the words "/wynntils config set <feature> <setting>
# <value>" takes: settings changed while retro is on and not stopped. Retro saves each setting's
# value before it first changes it, and puts that value back when retro goes off or stops or the
# game closes, unless the setting has been changed by hand since. A setting this Wynntils does
# not have, or a value it cannot read, is skipped with a warning in the log. Quote every value.
wynntils_config:
  # The item highlight as Wynntils' tag rather than Wynncraft's ornate frame.
  'ItemHighlight':
    'highlightTexture': 'tag'
  # Vanilla's player list (Tab) rather than Wynntils' own.
  'CustomPlayerListOverlay':
    'userEnabled': 'false'
  # Wynntils' gear-type icon on an unidentified gear box, which would sit on retro's
  # (gear_box_icons). Its texture setting has no "none", so the whole feature goes, and with it
  # the "?" it marks an unidentified item with.
  'UnidentifiedItemIcon':
    'userEnabled': 'false'
  # Wynntils' own content book only with shift held, so the book opens as Wynncraft's container,
  # which container_titles draws as vanilla's. Switching the feature off would take its key binds
  # (the content book, Wynntils menu and guides keys) with it.
  'WynntilsContentBook':
    'shiftBehaviorConfig': 'enabledIfShiftHeld'
