# Retro (2013) texture rules: which textures and item models the retro pack replaces, and
# with what. RetroManifest reads this file and retro_ingredients.yml each time the retro pack
# is generated; TextureRules and ModelRules apply them.
#
# Ids:
# - Every id is written in full, namespace first. A texture id names a PNG under textures/
#   ('minecraft:block/stone' is assets/minecraft/textures/block/stone.png); a model id names
#   a JSON under models/ ('minecraft:item/wynn/tool/iron_axe').
# - A colour is quoted '#RRGGBB'. A rectangle is [x, y, width, height] in pixels from the
#   texture's top left.
#
# Format:
# - One section per key below. Each section appears once and each key in a section appears
#   once (a repeat fails the build). The code ignores a section name it does not know, and
#   the build's tests reject one, so check the spelling. A row key its section does not have
#   fails the parse.
# - A pattern is a Java regular expression that must match the WHOLE id. Matching is
#   case-sensitive; ids are lowercase.
# - Quote every pattern and id. Use single quotes when it contains a backslash ('_\d+'):
#   inside double quotes only YAML's own escapes are allowed.
# - In a replacement, $1, $2, ... stand for the pattern's groups.
# - In a mapping section the first row, in file order, whose pattern matches decides; in a
#   list section any match counts. An empty pattern is ignored.
# - A table (recipes, materials, content_book_activities, potions) is keyed by lower-case names,
#   not patterns: it says once what a family of rows would repeat, and each name makes its rows.
# - Each section's comment gives its format, and a new row's shape where the rows below do not
#   show it.
#
# Which rule decides a texture, highest first. Each applies whether or not Wynncraft ships the
# texture, so 2013 art also replaces vanilla art Wynncraft leaves alone.
# 1. keep_wynncraft: Wynncraft's texture stays.
# 2. tints: a source's texture is tinted in. When no source has the texture it starts from, or
#    the texture it matches, Wynncraft's stays and the rules below are not tried.
# 3. aliases: the target texture is copied in. When no source has it, Wynncraft's stays and
#    same_name is not tried.
# 4. same_name: the texture of the same id is copied in. When no source has it, the rule does
#    not apply.
# 5. Otherwise Wynncraft's texture stays. One it ships fully transparent counts as a
#    deliberate blank, not a gap; a blank that should be restored needs a rule above.
# Then layer_groups can undo the copies and tints of a group (see there), and image_edits
# paints over a copy or tint. item_models, recipes, materials, content_book_activities, potions,
# equipment, wynncraft_copies, source_copies, wynntils_textures, blank_textures, lang,
# outlined_icons, accessory_tiers and block_models write files of their own and change no texture
# decision above. recipes, materials and content_book_activities write rows of item_models and
# source_copies more briefly.
# The sections from container_titles on write no files: the game reads them while it draws (see
# "Screens and settings" below). The one exception, gear_box_icons, also has the pack copy
# vanilla's item definition of each item it names.
# parts, first of all, decides none of this: it says which part of retro each id belongs to, so
# that a player can turn that part off and leave what it owns as Wynncraft's.

# ---- Parts ---------------------------------------------------------------------------------

# Part -> what it covers. Every part is on until the player turns it off (/wv retro parts, /wv retro
# only); a part off looks as if retro were not installed, but for art an on part draws too. The name
# is one of RetroPart's, and every part needs a row. /wv retro parts lists them in this order, which
# is RetroPart's. A row has:
# - about: what /wv retro parts says of the part.
# - textures, models (optional): patterns on whole ids. The first row in file order with a pattern
#   matching an id owns it; an id no row owns cannot be turned off. A new row of another section
#   needs an owner here, which the catch-alls of items may already be.
# - wynntils (optional): the wynntils_config features the part owns, by their literal names.
# What a part draws from code gates on its RetroPart there. The sections that only write into
# vetsmod's namespace (source_copies, wynncraft_copies, outlined_icons, accessory_tiers,
# gear_box_icons' item definitions) hide nothing, so no part owns them; what draws them gates.
# A texture items owns is shared art: Wynncraft's own models draw it, so while an off part's models
# do, it stays Wynncraft's, unless an on part draws it too, which replaces it everywhere.
parts:
  # With the blocks drawn from entity/ textures: a shulker box's folder is the shulker's too.
  blocks:
    about: 'Blocks in the world, signs, beds, banners and chests among them'
    textures:
      - 'minecraft:block/.*'
      - 'minecraft:entity/(banner|bed|bell|chest|conduit|decorated_pot|shulker|signs)/.*'
      - 'minecraft:entity/(banner_base|beacon_beam|enchanting_table_book|end_gateway_beam|end_portal)'
    models: ['minecraft:block/.*']
  # The worn layers are armour's below, but for the llama's decor, which layer_groups draws from one
  # source with its body.
  mobs:
    about: 'Mobs, animals and other entities'
    textures:
      - 'minecraft:entity/equipment/llama_body/.*'
      - 'minecraft:entity/(?!equipment/).*'
  weapons:
    about: 'Weapons and their skins, in the hand and in slots'
    models: ['minecraft:item/wynn/(weapon|skin)/.*']
  armour:
    about: 'Armour icons, and armour worn by mobs and stands'
    models: ['minecraft:item/wynn/armor/.*']
    textures:
      - 'minecraft:entity/equipment/.*'
      - 'minecraft:misc/enchanted_glint_armor'
  # Only what code draws: accessory_tiers, as RetroAccessories draws it. An empty slot's placeholder
  # is screens', as an empty armour slot's is.
  accessories:
    about: 'Rings, bracelets and necklaces, by level'
  tools:
    about: 'Profession tools'
    models: ['minecraft:item/wynn/tool/.*']
  crafting:
    about: 'Ingredients, materials, meals and papers'
    models: ['minecraft:item/wynn/(ingredient|economy)/.*']
  potions:
    about: 'Potions, of Wynncraft and of Avomod'
    models:
      - 'minecraft:item/wynn/potion/.*'
      - 'avomod2:.*'
  # With gear_box_icons and outlined_icons, as RetroSlotIcons draws them.
  gear_boxes:
    about: 'Unidentified gear boxes and mastery tomes'
    models:
      - 'minecraft:item/wynn/(gui/)?loot/.*'
      - 'minecraft:item/wynn/mastery_tome/.*'
    wynntils: ['UnidentifiedItemIcon']
  tooltips:
    about: 'Tooltip frames'
    textures: ['minecraft:gui/sprites/tooltip/.*']
  # With lang, the titles and backgrounds, the inventory label, slot values, the Ability Tree button's
  # glint, and the inert slots image_edits leaves. Under gui/, highlights has the tier layer and items
  # the content book, which a row of item_models draws as one item in the hotbar and the inventory.
  screens:
    about: "Container art, titles, buttons and menu names, and Wynntils' panels"
    textures:
      - 'minecraft:gui/container/.*'
      - 'minecraft:gui/sprites/widget/.*'
      - 'minecraft:gui/sprites/container/slot/.*'
      - 'minecraft:wynn/gui/slot/.*'
      - 'wynntils:.*'
    models: ['minecraft:item/wynn/gui/(?!layer/tier/|player/).*']
    wynntils: ['WynntilsContentBook']
  # slot_fills: the glass, the accessory edges and the mouse rule for an empty glass slot. It works on
  # the inventory without screens; a container gets no retro title without screens, so no fills.
  glass:
    about: 'Glass on the slots that are not yours to fill'
  # With LegacyHighlightPainter's retro circle.
  highlights:
    about: 'How an item in a slot shows its rarity'
    models: ['minecraft:item/wynn/gui/layer/tier/.*']
    wynntils: ['ItemHighlight']
  # With RetroHud: with it off, Wynncraft's action bar stays whole.
  hud:
    about: "Vanilla's hearts, food and experience bar for Wynncraft's"
    textures:
      - 'minecraft:gui/sprites/hud/.*'
      - 'minecraft:font/hud/.*'
  # With hidden_inventory_effects.
  effects:
    about: 'Effect icons, and no endless Attack Speed beside the inventory'
    textures: ['minecraft:mob_effect/.*']
  player_list:
    about: "Vanilla's player list instead of Wynntils'"
    wynntils: ['CustomPlayerListOverlay']
  # The catch-alls, last: keys, scrolls, mounts, runes, wards, powders, augments, the content book.
  items:
    about: 'Every other item: keys, scrolls, mounts, runes, wards, powders...'
    models: ['minecraft:item/wynn/.*']
    textures: ['minecraft:item/.*']

# ---- Sources -------------------------------------------------------------------------------

# Texture pattern -> the packs that texture is read from, most preferred first. The first row
# matching the texture that is read decides (for an alias, that is its target), and the first
# listed pack that has the texture supplies it, with the .mcmeta beside it. The packs:
# - vanilla_tweaks: the Vanilla Tweaks art the jar bundles (credits.txt), under retro/vanilla_tweaks.
# - programmer_art: the Programmer Art pack built into the running client.
# - vanilla: the running client's own textures.
sources:
  # Villagers show today's vanilla professions: Programmer Art has their body but no profession,
  # and a layered entity comes from one source (layer_groups).
  'minecraft:entity/(zombie_)?villager/.*': [vanilla]
  # The UI is today's vanilla: Programmer Art's few GUI files (an anvil, blue highlighted buttons)
  # would mix two looks. Withered hearts are the exception: vanilla's are hard to read at a glance,
  # and Vanilla Tweaks' WitherHearts are the same hearts made visible.
  'minecraft:gui/sprites/hud/heart/withered_(half|full)(_blinking)?': [vanilla_tweaks, vanilla]
  'minecraft:gui/.*': [vanilla]
  '.*': [vanilla_tweaks, programmer_art, vanilla]

# ---- Keep Wynncraft's ----------------------------------------------------------------------

# Texture pattern: textures Wynncraft blanks or repurposes on purpose. Its texture stays, even
# where a rule below would replace it.
keep_wynncraft:
  - 'minecraft:block/tripwire'                        # blank: tripwires are invisible
  # Its blockstate draws a blank model. The keys show the 2013 hook from a copy of their own
  # (source_copies).
  - 'minecraft:block/tripwire_hook'
  # Wynncraft's sponges cycle through rainbow colours (an animated strip with its .mcmeta);
  # same_name would make them the still 2013 sponge.
  - 'minecraft:block/(wet_)?sponge'
  - 'minecraft:block/daylight_detector_\w+'           # the block is a stack of books
  - 'minecraft:item/barrier'                          # Wynncraft's own red cross
  - 'minecraft:item/light_\d+'                        # the invisible light block's icons
  # Blank: the offhand slot's shield, a silhouette that would be drawn over the panel grey
  # image_edits paints there.
  - 'minecraft:gui/sprites/container/slot/shield'
  - 'minecraft:mob_effect/(haste|mining_fatigue)'     # the "Attack Speed" up and down arrows
  - 'minecraft:entity/trident'                        # blank
  - 'minecraft:entity/iron_golem/iron_golem_crackiness_\w+'   # blank: golems never crack
  # Worn copper armour keeps Wynncraft's look (equipment keeps its asset): no 2013 copper armour
  # exists, and same_name would bring today's vanilla copper in.
  - 'minecraft:entity/equipment/\w+/copper'
  # Wynncraft repaints every painting as its own world art. Vanilla's paintings are already the
  # 2013 ones, so a source could only remove it.
  - 'minecraft:painting/.*'
  # Wynncraft's spells and combat draw particles as sprite effects built from these textures
  # (its blanks and coloured glyphs among them), so retro leaves every particle alone.
  - 'minecraft:particle/.*'

# ---- Tints ---------------------------------------------------------------------------------

# Texture pattern -> a texture of a source with each of its red, green and blue multiplied by
# a factor, then its contrast changed, written in the texture's place with the .mcmeta beside
# the source. This draws the blocks Wynncraft adds with no vanilla equivalent ("dark" stone,
# molten rock) in 2013 art, brings a 2013 texture nearer the colour Wynncraft gives its block, and calms a 2013 texture too busy
# beside the rest. A row has a tint, a contrast or both.
# - source (optional): the texture tinted, read from its sources as a copy would be; the
#   texture's own id without one.
# - tint (optional): how each channel's factor is found; without one the source keeps its
#   colour. Every mean is over a texture's visible pixels.
#   "Wynncraft's" texture is the one the game shows without retro: Wynncraft's, or vanilla's
#   when Wynncraft ships none.
#   - '#RRGGBB': the colour's channel over 255, as Minecraft's own tints multiply.
#   - {match: <texture>}: that texture's mean, read from its sources, over the source's mean:
#     the source takes that texture's colour.
#   - {relative_to: <texture>}: the mean of Wynncraft's texture over the mean of Wynncraft's
#     <texture>: the source changes as Wynncraft changed its texture from that one.
#   - auto: the mean of Wynncraft's texture over the source's mean.
#   - {like: <texture>}: exactly the change the row for <texture> makes to that texture: its
#     factors and strength, measured on its own images, then its contrast around <texture>'s
#     mean after those factors (not the source's), so the pixels the source shares with
#     <texture> come out as they do there. Exactly one row must match <texture>, and it may not
#     be a like itself. A like row has no strength or contrast of its own.
# - strength (optional): how much of the factor is applied, from 0 (none) to 1 (all of it, the
#   default): factor = 1 + strength * (ratio - 1).
# - contrast (optional): after the tint, each channel of every visible pixel becomes
#   mean + contrast * (channel - mean), the mean of the tinted texture's visible pixels, so the
#   colour stays: below 1 flatter (0 is the mean throughout), 1 (the default) unchanged, above 1
#   busier.
# A channel stops at 0 and 255, and transparency is kept.
tints:
  # Wynncraft's plants are green before the biome's tint and 2013's grey, so in a biome tinted
  # brown 2013's would be brown. These take Wynncraft's colour, so the tint lands as it does there.
  'minecraft:block/(fern|large_fern_(top|bottom)|short_grass|tall_grass_(top|bottom)|vine)':
    tint: auto
  'minecraft:block/variants/short_grass_\d+':
    source: 'minecraft:block/short_grass'
    tint: auto
  # Wynncraft's note blocks and jukeboxes are the brown of its oak logs; the 2013 ones, redder,
  # take the 2013 oak log's colour.
  'minecraft:block/(note_block|jukebox_side|jukebox_top)':
    tint: {match: 'minecraft:block/oak_log'}
  # Wynncraft's diorite is nearly white; the 2013 one, greyer, takes a quartz block's colour.
  'minecraft:block/(polished_)?diorite':
    tint: {match: 'minecraft:block/quartz_block_side'}
  # Red nether bricks are newer than 2013: the 2013 nether bricks in their colour.
  'minecraft:block/red_nether_bricks':
    source: 'minecraft:block/nether_bricks'
    tint: {match: 'minecraft:block/red_nether_bricks'}
  # Wynncraft's "dark" stone family is its own stone, darkened: the 2013 stone, darkened as
  # Wynncraft darkened its own.
  'minecraft:block/variants/dark_(stone|cobblestone|stone_bricks|cracked_stone_bricks|chiseled_stone_bricks|mossy_stone_bricks)(_\d+)?':
    source: 'minecraft:block/$1'
    tint: {relative_to: 'minecraft:block/$1'}
  # Wynncraft's bedrock is nearly black: the 2013 bedrock, most of the way to black concrete
  # powder.
  'minecraft:block/bedrock':
    tint: {match: 'minecraft:block/black_concrete_powder'}
    strength: 0.7
  # Molten rock, Wynncraft's own animated block (the double petrified oak slab and
  # wood_old_double_slab draw it): the 2013 magma, darkened to Wynncraft's dark red. Magma is a
  # strip of frames; the tint keeps it whole and takes magma's .mcmeta with it.
  'minecraft:block/variants/molten_rock(_\d+)?':
    source: 'minecraft:block/magma'
    tint: auto
  # Furnaces, dispensers and droppers: the 2013 faces are far busier than the 2013 stone bricks.
  # The plain faces (the furnace's side and top) take the bricks' colour at under half their
  # contrast. A dispenser's or dropper's front is the face beside it with a mouth cut in (the
  # side's art for a front facing sideways, the top's for one facing up or down), so it takes that
  # face's change exactly, its stone blends into the block and the mouth stays darker. The
  # furnace's fronts are the same art beside the same side, so they take its change too. The 2013
  # lit furnace is a still image (Wynncraft's is animated), so it has no .mcmeta to take along.
  'minecraft:block/furnace_(side|top)':
    tint: {match: 'minecraft:block/stone_bricks'}
    contrast: 0.45
  'minecraft:block/(dispenser|dropper)_front':
    tint: {like: 'minecraft:block/furnace_side'}
  'minecraft:block/(dispenser|dropper)_front_vertical':
    tint: {like: 'minecraft:block/furnace_top'}
  'minecraft:block/furnace_front(_on)?':
    tint: {like: 'minecraft:block/furnace_side'}

# ---- Aliases -------------------------------------------------------------------------------

# Texture pattern -> the texture copied in its place. Wynncraft's own variants of vanilla
# blocks (block/variants/*, which its blockstates pick at random) get the vanilla block's
# texture. The variant families with no vanilla block ("dark" stone) are tints;
# Wynncraft's own blocks (cauldron barrels, crates, candles, crops) keep Wynncraft's art.
aliases:
  # Sky Wood, Wynncraft's repainted purpur: its bark is all but the 2013 oak log's colour.
  'minecraft:block/purpur_(block|pillar|pillar_side)': 'minecraft:block/oak_log'
  'minecraft:block/purpur_pillar_top': 'minecraft:block/oak_log_top'
  'minecraft:block/variants/(stone|cobblestone|mossy_cobblestone)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(cracked_stone_bricks|mossy_stone_bricks)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(coal_ore|emerald_ore|redstone_ore)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/(dirt|netherrack|sandstone)_\d+': 'minecraft:block/$1'
  'minecraft:block/variants/cobweb_\d+': 'minecraft:block/cobweb'
  # Void trees' leaves: full cubes Wynncraft's vine blockstate draws for some side combinations.
  'minecraft:block/variants/dead_leaves': 'minecraft:block/pale_oak_leaves'
  'minecraft:block/variants/grass_top_\d+': 'minecraft:block/grass_block_top'
  'minecraft:block/variants/sunflower_(front|back)': 'minecraft:block/sunflower_$1'
  'minecraft:block/variants/sunflower_bottom_\d+': 'minecraft:block/sunflower_bottom'
  # Every tooltip style Wynncraft adds (normal, unique, ..., mythic_shiny) gets the vanilla
  # frame and background, with the .mcmeta that makes them nine-slice sprites. The gold LEGACY
  # border keeps Wynncraft's unique style through a copy (wynncraft_copies).
  'minecraft:gui/sprites/tooltip/\w+_(background|frame)': 'minecraft:gui/sprites/tooltip/$1'
  # An empty armour slot holds a placeholder item of Wynncraft's, drawn with its orange
  # silhouette of the piece: vanilla's grey one instead. The accessory placeholders have no vanilla
  # silhouette, so item_models draws vetsmod's own, in the same style.
  'minecraft:wynn/gui/slot/(helmet|chestplate|leggings|boots)': 'minecraft:gui/sprites/container/slot/$1'
  # The ends of Wynncraft's dirt columns; vanilla dirt is dirt all round.
  'minecraft:block/variants/dirt_top(_\d+)?': 'minecraft:block/dirt'
  # Vanilla's pumpkin uses its top texture for the bottom too.
  'minecraft:block/variants/pumpkin_bottom': 'minecraft:block/pumpkin_top'
  # Fences and gates, and the ends of bookshelves; vanilla uses oak planks for both.
  'minecraft:block/variants/oak_(fence|planks_flat)': 'minecraft:block/oak_planks'
  # The edges of iron bars, which vanilla cuts from the bars texture itself.
  'minecraft:block/variants/iron_bars_top': 'minecraft:block/iron_bars'
  # The six-sided piston (2013's block 33:6): the piston's plank face on all six sides, for every
  # face any piston draws. Wynncraft's pistons are crates: vanilla's piston blockstate, which it
  # leaves alone, with vanilla's piston textures repainted, and its own sticky_piston blockstate,
  # whose variants/sticky_piston and variants/sticky_piston_base models draw the variants/ ones.
  'minecraft:block/piston_(bottom|inner|side|top_sticky)': 'minecraft:block/piston_top'
  'minecraft:block/variants/piston_(bottom|inner|side_sticky|top_sticky)': 'minecraft:block/piston_top'

# ---- Same name -----------------------------------------------------------------------------

# Texture pattern: a texture it matches is replaced by the texture of the same id. Most of
# Wynncraft's own textures have no such source and fall through. Wynncraft's other GUI sprites
# stay, its other HUD blanks among them (armour, air, a mount's hearts and jump bar, the attack
# indicators): retro draws nothing new with them.
same_name:
  - 'minecraft:block/.*'
  - 'minecraft:item/.*'
  - 'minecraft:entity/.*'
  - 'minecraft:mob_effect/.*'
  # The glint on worn armour, which Vanilla Tweaks' OldEnchantGlint restores.
  - 'minecraft:misc/enchanted_glint_armor'
  # Container backgrounds Wynncraft repaints: the chest (generic_54), hopper, horse and
  # inventory screens, and any it repaints later.
  - 'minecraft:gui/container/.*'
  # Buttons, sliders and scrollbars, which Wynncraft repaints in brown.
  - 'minecraft:gui/sprites/widget/.*'
  # The vanilla tooltip, which Wynncraft repaints too.
  - 'minecraft:gui/sprites/tooltip/(background|frame)'
  # The armour slots' own silhouettes, which Wynncraft blanks (it fills an empty armour slot
  # with a placeholder item, which aliases draws as these): shown when a slot is truly empty.
  - 'minecraft:gui/sprites/container/slot/(helmet|chestplate|leggings|boots)'
  # The HUD retro draws in place of Wynncraft's (RetroHud): hearts for health, food for mana, and
  # the experience bar, which Wynncraft blanks, and the hotbar, which it repaints under its own
  # frame. Each beats the automatic keep of a blank.
  - 'minecraft:gui/sprites/hud/heart/(container|half|full|poisoned_half|poisoned_full|withered_half|withered_full)(_blinking)?'
  - 'minecraft:gui/sprites/hud/food_(empty|half|full)'
  - 'minecraft:gui/sprites/hud/experience_bar_(background|progress)'
  # A mount's jump bar, which takes the experience bar's place while riding, as vanilla's does.
  - 'minecraft:gui/sprites/hud/jump_bar_(background|cooldown|progress)'
  - 'minecraft:gui/sprites/hud/hotbar(_selection|_offhand_left|_offhand_right)?'

# ---- Layer groups --------------------------------------------------------------------------

# Texture pattern: the textures one pattern matches are drawn in layers on one model, so they
# must come from one source. Unless every member Wynncraft ships is copied or tinted in, all
# from the same source, none of them is.
layer_groups:
  # Body, biome, profession and level badge. Wynncraft also ships unused textures at the folder's
  # top (entity/villager/farmer) that no model draws and vanilla lacks, which are not members.
  - 'minecraft:entity/(zombie_)?villager/((zombie_)?villager|type/.*|profession/.*|profession_level/.*)'
  - 'minecraft:entity/horse/horse_(white|creamy|chestnut|brown|black|gray|darkbrown|markings_\w+)'
  - 'minecraft:entity/wolf/.*'                        # body and collar
  - 'minecraft:entity/cat/.*'                         # body and collar
  - 'minecraft:entity/(llama/(white|creamy|brown|gray)|equipment/llama_body/\w+)'   # body and decor
  - 'minecraft:entity/sheep/.*'                       # body, wool and undercoat

# ---- Item models ---------------------------------------------------------------------------

# Model pattern -> what the retro pack's small stub for that model draws. materials and
# content_book_activities make rows of this section too, tried before these. A row is one of:
# - a texture id: that texture held flat, like most items, on a layer the stack's colour does not
#   tint (Wynncraft colours its weapons and armour by that colour). It is in block/ or item/ (a
#   stub draws from one atlas, so any other folder is refused). A vanilla item whose icon is a
#   block texture (a sapling) is drawn from that texture, and a texture a rule above keeps from
#   its copy (source_copies).
# - {texture: <id>, parent: <how>}: the same, held after the vanilla model that positions the item
#   it shows: handheld (diagonally, like a tool), handheld_rod (like a fishing rod), bow (like a
#   bow) or generated (flat, as above).
# - {model: <id>}: a vanilla item model, or one of vetsmod's own under vetsmod:item/retro/, which
#   the stub names as its parent and nothing else, as an ingredient's stub does. The stack's colour
#   tints that model as it tints the vanilla item: a dyed item keeps its own dye.
# New rows:
#   'minecraft:item/wynn/x/flat': 'minecraft:item/stick'
#   'minecraft:item/wynn/x/held': {texture: 'minecraft:item/iron_axe', parent: handheld}
#   'minecraft:item/wynn/x/own': {model: 'minecraft:item/music_disc_cat'}
# Wynncraft's item definitions are never copied or edited. Most of its items are potion stacks
# (white in the dumps, coloured for weapons), whose models take the potion's colour; a texture
# row draws on a parent no tint reaches, whatever the stack's colour.
item_models:
  # Weapons: one vanilla item per class, for the plain models and every skin.
  'minecraft:item/wynn/(weapon/\w+/spear_|skin/spear/)\w+': {texture: 'minecraft:item/iron_shovel', parent: handheld}
  'minecraft:item/wynn/(weapon/\w+/wand_|skin/wand/)\w+': {texture: 'minecraft:item/stick', parent: handheld}
  # But the frying pan, which is also the pan on every cooking station, stays Wynncraft's.
  'minecraft:item/wynn/(weapon/\w+/dagger_|skin/dagger/(?!frying_pan$))\w+': 'minecraft:item/shears'
  'minecraft:item/wynn/(weapon/\w+/bow_|skin/bow/)\w+': {texture: 'minecraft:item/bow', parent: bow}
  'minecraft:item/wynn/(weapon/\w+/relik_|skin/relik/)\w+': {texture: 'minecraft:item/bone', parent: handheld}
  # Armour: the vanilla piece of the same material. pale_ is the paler copy of a material.
  'minecraft:item/wynn/armor/\w+/(?:pale_)?gold_(helmet|chestplate|leggings|boots)': 'minecraft:item/golden_$1'
  'minecraft:item/wynn/armor/\w+/(?:pale_)?(chainmail|iron|diamond|netherite)_(helmet|chestplate|leggings|boots)': 'minecraft:item/$1_$2'
  # Titanium, the tier Wynncraft added above diamond, has no vanilla piece; netherite is the
  # one above diamond in vanilla.
  'minecraft:item/wynn/armor/\w+/(?:pale_)?titanium_(helmet|chestplate|leggings|boots)': 'minecraft:item/netherite_$1'
  # Leather: the vanilla leather piece itself. Wynncraft's leather and pale_leather models are
  # tinted by the stack's dye (vanilla leather's brown when it has none), exactly as vanilla's
  # leather_<piece> model is, so each piece shows in its own dye with its overlay undyed.
  'minecraft:item/wynn/armor/\w+/(?:pale_)?leather_(helmet|chestplate|leggings|boots)': {model: 'minecraft:item/leather_$1'}
  # Profession tools, whatever their material.
  'minecraft:item/wynn/tool/\w+_axe': {texture: 'minecraft:item/iron_axe', parent: handheld}
  'minecraft:item/wynn/tool/\w+_pickaxe': {texture: 'minecraft:item/iron_pickaxe', parent: handheld}
  'minecraft:item/wynn/tool/\w+_rod': {texture: 'minecraft:item/fishing_rod', parent: handheld_rod}
  'minecraft:item/wynn/tool/\w+_scythe': {texture: 'minecraft:item/iron_hoe', parent: handheld}
  # Keys: the dungeon keys and the corrupted dungeons' broken keys, the tripwire hook. Its own
  # texture is kept (keep_wynncraft), so the stub draws the 2013 hook's copy (source_copies).
  'minecraft:item/wynn/dungeon/key(_broken)?': 'vetsmod:block/retro/tripwire_hook'
  # Maps: the teleportation scrolls.
  'minecraft:item/wynn/scroll/\w+': 'minecraft:item/map'
  # Paper: the woodcutting papers and scrolls (crafting paper, crafted scrolls such as a Raid
  # scroll, and notes such as the Note from Enkser).
  'minecraft:item/wynn/economy/woodcutting/(?:paper_(?:brown|cream|white)|scroll_\w+)': 'minecraft:item/paper'
  # Meals, the cooked food (Lucky Treat is a soup): the nearest food, 2013's where one fits.
  'minecraft:item/wynn/economy/meals/fried': 'minecraft:item/cooked_chicken'  # a drumstick
  'minecraft:item/wynn/economy/meals/generic(_item)?': 'minecraft:item/cooked_beef'  # a steak on a plate
  # A bowl of greens: 2013 has no salad, and its one bowl, the stew, is the soup's.
  'minecraft:item/wynn/economy/meals/salad': 'minecraft:item/beetroot_soup'
  'minecraft:item/wynn/economy/meals/soup': 'minecraft:item/mushroom_stew'
  'minecraft:item/wynn/economy/meals/spicy': 'minecraft:item/bread'  # a filled flatbread
  'minecraft:item/wynn/economy/meals/steamed': 'minecraft:item/baked_potato'  # a leaf-wrapped dumpling
  # Mount saddles: the saddle for the horse's, and the raptor's (the Adasaur Harness) red and the
  # wyvern's white, from their copies (source_copies).
  'minecraft:item/wynn/mount/horse_saddle': 'minecraft:item/saddle'
  'minecraft:item/wynn/mount/raptor_saddle': 'vetsmod:item/retro/saddle_red'
  'minecraft:item/wynn/mount/wyvern_saddle': 'vetsmod:item/retro/saddle_white'
  # What calls each mount: the Horse Whistle leather horse armour, in vanilla's undyed colour on
  # a model of vetsmod's, the Wyvern Flute iron and the Adasaur Ocarina copper.
  'minecraft:item/wynn/mount/horse_whistle': {model: 'vetsmod:item/retro/leather_horse_armor'}
  'minecraft:item/wynn/mount/wyvern_whistle': 'minecraft:item/iron_horse_armor'
  'minecraft:item/wynn/mount/raptor_whistle': 'minecraft:item/copper_horse_armor'
  # Unidentified gear boxes, in the GUI (gui/loot/) and held or dropped (loot/): a 3D chest
  # of vetsmod's, drawn from the chest's copy (source_copies). The GUI draws the box's gear
  # type over it (gear_box_icons).
  'minecraft:item/wynn/(gui/)?loot/(unique|rare|legendary|fabled|mythic|set)': {model: 'vetsmod:item/retro/chest'}
  # The ingredient pouch, empty, half full or full, and the crafter bags: the bundle, which 2013
  # lacked (vanilla's).
  'minecraft:item/wynn/pouch/(ingredient_(empty|half|full)|crafter_(varied|packed|stuffed))': 'minecraft:item/bundle'
  # Runes: music discs, each as vanilla's own disc item. Programmer Art has only disc 11, so
  # these are vanilla's discs. The blank rune keeps Wynncraft's art.
  'minecraft:item/wynn/rune/nii': {model: 'minecraft:item/music_disc_mellohi'}
  'minecraft:item/wynn/rune/az': {model: 'minecraft:item/music_disc_wait'}
  'minecraft:item/wynn/rune/tol': {model: 'minecraft:item/music_disc_cat'}
  'minecraft:item/wynn/rune/ek': {model: 'minecraft:item/music_disc_13'}
  'minecraft:item/wynn/rune/uth': {model: 'minecraft:item/music_disc_mall'}
  # Wards: the stained glass block of their colour, as vanilla's own block item.
  'minecraft:item/wynn/ward/(black|blue|cyan|green|orange|pink|purple|red|white|yellow)': {model: 'minecraft:block/$1_stained_glass'}
  # Wynncraft's own tier layer, under the runes and wards in a slot: Wynntils hides this layer
  # from gear, ingredients, materials and store items and draws its own highlight, but its list
  # leaves these two out. They get the look of retro's tag highlight, in Wynncraft's colour.
  'minecraft:item/wynn/gui/layer/tier/(tab|full)': {model: 'vetsmod:item/retro/tier_tag'}
  # The content book, in the hotbar and on the inventory's own button.
  'minecraft:item/wynn/(gui/)?player/content_book': 'minecraft:item/knowledge_book'
  # The ability shard: a lingering potion, its liquid the colour of the shard's name.
  'minecraft:item/wynn/player/ability_shard': {model: 'vetsmod:item/retro/ability_shard'}
  # Corkian augments.
  'minecraft:item/wynn/augment/corkian_amplifier': 'minecraft:item/shulker_shell'
  'minecraft:item/wynn/augment/corkian_simulator': 'minecraft:item/ender_eye'
  'minecraft:item/wynn/augment/corkian_insulator': 'minecraft:item/spectral_arrow'
  # Hashr's Crown, the Sand-Swept Tomb's token, corrupted or not.
  'minecraft:item/wynn/dungeon/token/sand_swept_tomb': 'minecraft:item/golden_helmet'
  # Powders: 2013's dyes, the dye Wynncraft's own item definitions (items/<colour>_dye.json) send
  # to each powder. Each size of an element has its own: small and large are told apart by the
  # dye, as Wynncraft's definitions tell them. Air gray and light gray, earth lime and green,
  # thunder yellow and orange, water light blue and cyan, fire pink and red.
  'minecraft:item/wynn/powder/small_air': 'minecraft:item/gray_dye'
  'minecraft:item/wynn/powder/large_air': 'minecraft:item/light_gray_dye'
  'minecraft:item/wynn/powder/small_earth': 'minecraft:item/lime_dye'
  'minecraft:item/wynn/powder/large_earth': 'minecraft:item/green_dye'
  'minecraft:item/wynn/powder/small_thunder': 'minecraft:item/yellow_dye'
  'minecraft:item/wynn/powder/large_thunder': 'minecraft:item/orange_dye'
  'minecraft:item/wynn/powder/small_water': 'minecraft:item/light_blue_dye'
  'minecraft:item/wynn/powder/large_water': 'minecraft:item/cyan_dye'
  'minecraft:item/wynn/powder/small_fire': 'minecraft:item/pink_dye'
  'minecraft:item/wynn/powder/large_fire': 'minecraft:item/red_dye'
  # Plants whose art is grey: Minecraft colours it through the vanilla item's definition or the
  # world's biome, and these Wynncraft items are potions, whose white tint leaves it grey. They
  # draw green copies (source_copies) instead. A new item on these textures needs adding here.
  'minecraft:item/wynn/(?:dungeon/fragment/undergrowth_ruins|ingredient/(?:alga|algae_mat|ancient_moss|bioluminescent_moss|creepvine_cluster|thick_vines))': 'vetsmod:block/retro/green/vine'
  'minecraft:item/wynn/ingredient/(?:decomposing_snapdragon|etheric_fern|liff_leaf|pristine_liff_leaf|munched_grass|secret_herb|sticky_fern|undiscovered_plant|viral_tentacle)': 'vetsmod:block/retro/green/fern'
  'minecraft:item/wynn/ingredient/(?:canyon_parsley|illicit_helmlock|mega_fern|water_dropwort)': 'vetsmod:block/retro/green/large_fern_top'
  'minecraft:item/wynn/ingredient/(?:hunters_disguise|waterfall_thyme)': 'vetsmod:block/retro/green/short_grass'
  'minecraft:item/wynn/ingredient/(?:gert_skin|green_fin|green_foot|green_scale|sludge_parasite)': 'vetsmod:block/retro/green/lily_pad'
  # A grass block, whose top and side overlay are the grey ones.
  'minecraft:item/wynn/outer_void/drop/arable_chunk': {model: 'vetsmod:item/retro/arable_chunk'}
  # An empty accessory slot's placeholder: the outline of its type's art (accessory_tiers), in the
  # style of vanilla's empty armour slots, in place of Wynncraft's orange one.
  'minecraft:item/wynn/gui/slot/(ring|bracelet|necklace)': {model: 'vetsmod:item/retro/accessory/$1_empty'}
  # The compass menu's buttons and the guild's boosts.
  'minecraft:item/wynn/gui/character_info/recruit_friend': 'minecraft:item/structure_void'
  'minecraft:item/wynn/gui/character_info/daily_(?:available|cooldown)': {model: 'vetsmod:item/retro/chest'}
  'minecraft:item/wynn/gui/character_info/store': {model: 'vetsmod:item/retro/ender_chest'}
  'minecraft:item/wynn/gui/character_info/ability_tree': 'minecraft:item/enchanted_book'
  'minecraft:item/wynn/gui/character_info/skill_crystal': 'minecraft:item/slime_ball'
  'minecraft:item/wynn/gui/character_info/book_(agility|defense|dexterity|intelligence|strength)': 'minecraft:item/written_book'
  'minecraft:item/wynn/gui/store/silverbull_emblem': {model: 'minecraft:block/sea_lantern'}
  # The brown bar over a player trade's centre column: trade_icon in its middle slot, and column,
  # which every structure_void stack draws, in the two beside it. Blank, so each slot still shows
  # whose side is whose in its tooltip.
  'minecraft:item/wynn/gui/(trade_icon|column)': {model: 'vetsmod:item/retro/blank'}
  # The content book's buttons outside its activities (content_book_activities).
  'minecraft:item/wynn/gui/content_book/world_event_complete': 'minecraft:item/green_dye'
  'minecraft:item/wynn/gui/content_book/complete': 'minecraft:item/bone_meal'
  'minecraft:item/wynn/gui/content_book/locked': 'minecraft:item/gray_dye'
  # Mastery tomes: the enchanted book, whatever their type; the type is drawn over it in the GUI
  # (gear_box_icons).
  'minecraft:item/wynn/mastery_tome/\w+': 'minecraft:item/enchanted_book'

# ---- Recipes -------------------------------------------------------------------------------

# Recipe name -> a way one piece of art takes a colour. materials and source_copies then ask for
# that art in a colour by the recipe's name, and code by Recipe.recolour(colour). A row has:
# - art: the texture, read from its sources as a copy is.
# - scale_from (optional): a colour in the art as its first source draws it, usually its main one.
#   Each channel is scaled so that colour comes out as the one asked for, which can lighten the art.
# - hue_of (optional): as scale_from, on the pixels of that colour's hue alone; the rest of the art
#   is left as it is. The colour needs one strongest channel.
# With neither, each channel is multiplied by the colour's, as Minecraft's own tints do: it suits
# grey art, and it can only darken. Scaling and multiplying leave the art's outline undyed, so a
# black line stays black: its near-grey pixels darker than half the scale_from colour, and never
# brighter than 64, the cutoff when multiplying. Name a recipe after its art. A new one:
#   carrot: {art: 'minecraft:item/carrot', scale_from: '#FF8E09'}
recipes:
  # An oil is the water bucket with its water, and nothing else, in the colour of the fish.
  bucket: {art: 'minecraft:item/water_bucket', hue_of: '#345FDA'}
  # The art's green and nothing else: its shading stays.
  emerald: {art: 'minecraft:item/emerald', hue_of: '#41F384'}
  # The paper's sheet comes out as the colour; the string, grey art, is multiplied by it.
  paper: {art: 'minecraft:item/paper', scale_from: '#D6D6D6'}
  string: {art: 'minecraft:item/string'}
  # The leather's colour, in Programmer Art's saddle and in vanilla's.
  saddle: {art: 'minecraft:item/saddle', scale_from: '#DA662C'}
  # The other materials, from the art's main colour.
  copper_ingot: {art: 'minecraft:item/copper_ingot', scale_from: '#C15A36'}
  iron_ingot: {art: 'minecraft:item/iron_ingot', scale_from: '#D8D8D8'}
  nether_brick: {art: 'minecraft:item/nether_brick', scale_from: '#3E1E24'}
  brick: {art: 'minecraft:item/brick', scale_from: '#B75A40'}
  netherite_ingot: {art: 'minecraft:item/netherite_ingot', scale_from: '#3B393B'}
  prismarine_shard: {art: 'minecraft:item/prismarine_shard', scale_from: '#7FB8A4'}
  clay_ball: {art: 'minecraft:item/clay_ball', scale_from: '#A5A9B9'}
  glowstone_dust: {art: 'minecraft:item/glowstone_dust', scale_from: '#D2D200'}
  nether_wart: {art: 'minecraft:item/nether_wart', scale_from: '#A62530'}
  melon_seeds: {art: 'minecraft:item/melon_seeds', scale_from: '#615535'}
  wheat_seeds: {art: 'minecraft:item/wheat_seeds', scale_from: '#69B038'}
  cocoa_beans: {art: 'minecraft:item/cocoa_beans', scale_from: '#976746'}
  pumpkin_seeds: {art: 'minecraft:item/pumpkin_seeds', scale_from: '#CBC68D'}
  beetroot_seeds: {art: 'minecraft:item/beetroot_seeds', scale_from: '#DEB075'}
  cooked_cod: {art: 'minecraft:item/cooked_cod', scale_from: '#AE8B67'}
  cod: {art: 'minecraft:item/cod', scale_from: '#986D4E'}
  salmon: {art: 'minecraft:item/salmon', scale_from: '#AB3533'}
  cooked_salmon: {art: 'minecraft:item/cooked_salmon', scale_from: '#BA4F23'}
  oak_door: {art: 'minecraft:item/oak_door', scale_from: '#9F844D'}
  spruce_door: {art: 'minecraft:item/spruce_door', scale_from: '#7A5A36'}
  # A potion's liquid and the leather horse armour's dyed layer, grey art vanilla dyes.
  potion_overlay: {art: 'minecraft:item/potion_overlay'}
  leather_horse_armor: {art: 'minecraft:item/leather_horse_armor'}
  # The plants, grey art the biome or the vanilla item's definition colours.
  vine: {art: 'minecraft:block/vine'}
  lily_pad: {art: 'minecraft:block/lily_pad'}
  fern: {art: 'minecraft:block/fern'}
  large_fern_top: {art: 'minecraft:block/large_fern_top'}
  short_grass: {art: 'minecraft:block/short_grass'}
  grass_block_top: {art: 'minecraft:block/grass_block_top'}
  grass_block_side_overlay: {art: 'minecraft:block/grass_block_side_overlay'}
  # A heart's red and its shade; the one pale pixel takes the colour too.
  heart_full: {art: 'minecraft:gui/sprites/hud/heart/full', hue_of: '#FF1313'}
  heart_half: {art: 'minecraft:gui/sprites/hud/heart/half', hue_of: '#FF1313'}

# ---- Materials -----------------------------------------------------------------------------

# Family -> the profession materials of one kind, each a model drawn flat, which become rows of
# item_models and source_copies, tried before their own. A family has:
# - models: what the family's model ids start with; each name below completes one.
# - vanilla: name -> the texture it draws.
# - the name of a recipe: name -> the colour that recipe gives it, which is a copy of the recipe's
#   art at vetsmod:item/retro/material/<family>_<name>.
# A name goes under one heading of its family. A new material is one word and one colour, added to
# its heading:
#   string: {sisal: '#D8C89A'}
materials:
  ingot:
    models: 'minecraft:item/wynn/economy/mining/ingot_'
    vanilla:
      cinnabar: 'minecraft:item/brick'
      copper: 'minecraft:item/copper_ingot'
      gold: 'minecraft:item/gold_ingot'
      iron: 'minecraft:item/iron_ingot'
      molten: 'minecraft:item/nether_brick'
      titanium: 'minecraft:item/netherite_ingot'
    copper_ingot: {bronze: '#C36C24'}
    iron_ingot: {cobalt: '#5DA0DD', diamond: '#8BE8F8', kanderstone: '#9ED1BF',
                 sandstone: '#D7C37A', silver: '#EEF5F4', steel: '#7A7078'}
    nether_brick: {dernic: '#463750'}
    brick: {granite: '#CF976D'}
    netherite_ingot: {void: '#C96DC6'}
  gem:
    models: 'minecraft:item/wynn/economy/mining/gem_'
    vanilla:
      cinnabar: 'minecraft:item/redstone'
      copper: 'minecraft:item/copper_nugget'
      diamond: 'minecraft:item/diamond'
      gold: 'minecraft:item/gold_nugget'
      iron: 'minecraft:item/iron_nugget'
      kander: 'minecraft:item/prismarine_crystals'
      sandstone: 'minecraft:item/glowstone_dust'
      silver: 'minecraft:item/clay_ball'
      titanium: 'minecraft:item/prismarine_shard'
      void: 'minecraft:item/popped_chorus_fruit'
    prismarine_shard: {cobalt: '#5A98DC'}
    emerald: {dernic: '#6E3CA8'}
    clay_ball: {granite: '#EBAC78'}
    glowstone_dust: {molten: '#FF452E'}
  grain:
    models: 'minecraft:item/wynn/economy/farming/grain_'
    vanilla:
      barley: 'minecraft:item/pumpkin_seeds'
      decay: 'minecraft:item/melon_seeds'
      dernic: 'minecraft:item/nether_wart'
      rye: 'minecraft:item/beetroot_seeds'
      sorghum: 'minecraft:item/cocoa_beans'
      wheat: 'minecraft:item/wheat_seeds'
    nether_wart: {heather: '#A880B8'}
    melon_seeds: {hemp: '#6A8A30'}
    wheat_seeds: {hops: '#3F7A32', oat: '#C2D04C'}
    cocoa_beans: {jute: '#9C9480'}
    pumpkin_seeds: {malt: '#D9A050', rice: '#F4F0E4'}
    beetroot_seeds: {millet: '#C8A040'}
  string:
    models: 'minecraft:item/wynn/economy/farming/string_'
    vanilla:
      rice: 'minecraft:item/string'
    string: {barley: '#C8A020', decay: '#8B7444', dernic: '#D9C7DE', heather: '#B45BBA',
             hemp: '#9FB454', hops: '#859F64', jute: '#E2B28D', malt: '#E0C050', millet: '#DDBB77',
             oat: '#D6E66A', rye: '#CBA663', sorghum: '#FFC388', wheat: '#FFDE9A'}
  oil:
    models: 'minecraft:item/wynn/economy/fishing/oil_'
    vanilla:
      koi: 'minecraft:item/milk_bucket'
      molten: 'minecraft:item/lava_bucket'
    bucket: {bass: '#7E9A50', carp: '#A88B56', dernic: '#A187A2', gudgeon: '#8EABBD',
             gylia: '#DA6DDE', ice: '#A7E7F9', mahseer: '#D9C881', piranha: '#4C6993',
             salmon: '#C43B19', star: '#D26100', sturgeon: '#8A8BA0', trout: '#6C7E8A'}
  meat:
    models: 'minecraft:item/wynn/economy/fishing/meat_'
    vanilla:
      bass: 'minecraft:item/cooked_cod'
      gudgeon: 'minecraft:item/cod'
      koi: 'minecraft:item/tropical_fish'
      molten: 'minecraft:item/cooked_salmon'
      salmon: 'minecraft:item/salmon'
      star: 'minecraft:item/pufferfish'
    cooked_cod: {carp: '#D0B030', sturgeon: '#F0C6B2'}
    cod: {dernic: '#8D7889', ice: '#9CC4D8', piranha: '#4F6F9C', trout: '#6A91A6'}
    salmon: {gylia: '#B856BD'}
    cooked_salmon: {mahseer: '#E87830'}
  # The wood's door, and the iron door for light, whose art is a neutral grey. Pine's art is far
  # darker than any door, and willow stands for poplar, whose door came in 26.3 and is not in
  # 1.21.11's files, so those two are tints of spruce's and oak's.
