      maple: 'minecraft:item/cherry_door'
      avo: 'minecraft:item/bamboo_door'
    oak_door: {willow: '#5A6E48'}
    spruce_door: {pine: '#58452F'}
  # Paper in the colour of that wood's planks. The plain papers and the scrolls are item_models'
