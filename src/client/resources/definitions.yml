# Item lists for legacy-item detection, loaded once at startup by ItemDefinitions.
#
# Format:
# - One section per key below, each a list of entries. Each section appears once (a
#   repeated one fails the build). A section name the code does not know is ignored,
#   so check the spelling.
# - Every entry is a Java regular expression that must match the WHOLE name, not part
#   of it. Item names are compared with colour codes, Wynncraft's glyphs and the trade
#   market's trailing "À" removed; screen titles with colour codes removed. (The
#   exception is enchant_excluded_items, which lists plain Minecraft item ids.)
# - Matching is case-sensitive unless the pattern starts with (?i).
# - Quote every entry. Use single quotes when the pattern contains a backslash
#   ('^\?$'), and write an apostrophe inside single quotes as ''. Inside double quotes
#   only YAML escapes such as \u00e9 are allowed.
# - Order does not matter, and an empty entry is ignored.

# ---- Legacy items ------------------------------------------------------------

# Legacy by name, whatever the lore says.
definitions:
  - "^A Washer$"
  - "(?i)^.*Animal Key$"
  - "(?i)^Animal Key.*$"
  - "(?i)^Average Golden .*$"
  - "(?i)^Ba'al's Betrayal.*$"
  - "(?i)^Block Of Red Wool.*$"
