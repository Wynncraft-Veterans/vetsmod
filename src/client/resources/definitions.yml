  - "minecraft:enchanted_book"
---
# Items whose names collide with legacy patterns but also exist as current
# new-format items.  When a name matches here AND the item uses the new
# display format (PUA in custom_name), the legacy name match is suppressed.
new_format_override:
  - "(?i)^Skeleton Key$"
