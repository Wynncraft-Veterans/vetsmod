---
# Items that are legacy ONLY when they have no lore lines.
# Unlike the "definitions" section (which matches regardless of lore), items here
# must ALSO have an empty lore to be treated as legacy.  This covers old keys,
# vanilla materials, holiday items, and other confirmed loreless legacy items.
# Items that also appear in "definitions" are listed here for completeness but
# will be caught by the earlier definitions check first.
no_lore_legacy:
  - "(?i)^Animal Key$"
  - "(?i)^Block of Quartz$"
  - "(?i)^Block of Red Wool$"
  - "(?i)^Bone Meal$"
  - "(?i)^Cow Pass$"
  - "(?i)^Drawing of the Spirits.*$"
  - "(?i)^Fiert\u00e9$"
  - "(?i)^Gert Mask$"
  - "(?i)^Glass Bottle$"
  - "(?i)^Grian's Trusty Ocean Map$"
  - "(?i)^Pigman's Meat$"
  - "(?i)^Rotten Flesh$"
  - "(?i)^Salted's Trusty Poop$"
  - "(?i)^Silverfish Key$"
  - "(?i)^Skeleton Key$"
  - "(?i)^Spider Key$"
  - "(?i)^Wheat$"
  - "(?i)^Zombie Key$"
