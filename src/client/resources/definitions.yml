# Legacy only when the item has no lore at all (old keys, bare vanilla materials).
no_lore_legacy:
  - "(?i)^Animal Key$"
  - "(?i)^Block of Quartz$"
  - "(?i)^Block of Red Wool$"
  - "(?i)^Bone Meal$"
  - "(?i)^Cow Pass$"
  - "(?i)^Drawing of the Spirits.*$"
  - "(?i)^Fiert\u00e9$"
  - "(?i)^Gert Mask$"
  - "(?i)^Glass Bottle$"
  - "(?i)^Grian's Trusty Ocean Map$"
  - "(?i)^Pigman's Meat$"
  - "(?i)^Rotten Flesh$"
  - "(?i)^Salted's Trusty Poop$"
  - "(?i)^Silverfish Key$"
  - "(?i)^Skeleton Key$"
  - "(?i)^Spider Key$"
  - "(?i)^Wheat$"
  - "(?i)^Wolf['\u2019]s Fang$"
  - "(?i)^Zombie Key$"

# ---- Exceptions --------------------------------------------------------------

# Names used by both a legacy item and a current item. On an item in Wynncraft's
# current name format, the definitions and misc_definitions matches are skipped;
# no_lore_legacy still applies.
new_format_override:
  - "(?i)^Skeleton Key$"
  - "(?i)^Wolf Fang$"

# Current items that carry the enchantment glint, so the glint alone does not make
# them legacy. A name in definitions stays legacy either way.
unenchanted:
  - '^\?\?\?$'
  - "^Ability Shard$"
  - "^Battlemaster's Crest$"
  - "^Breathing Helmet .*"
  - "^Cycle$"
  - "^.*Liquid Emerald.*$"
  - "^.*Mythic Everlasting Pufferfish.*$"
  - "^Shiny .*"
  - "^.*The Axe of Llevigar$"
  - "^.*Transcriber$"

# Minecraft item ids (not patterns) whose glint is vanilla.
enchant_excluded_items:
  - "minecraft:enchanted_book"
  - "minecraft:experience_bottle"

# Current items with a "Junk Item" rarity line, so that line alone does not make
# them legacy.
notjunk:
  - "^Dusty Rum Bottle$"
  - "^Ghostly .*"
  - "^Golden Teeth$"
  - "(?i)^Leather$"
  - "^Roasted Flesh$"
  - "^Rubble$"
  - "^Tanned Sunfish$"
  - "^.*Vine.*$"

# Never treated as a pedestal-wiped item (a bare armour or weapon shell with a
# coloured name and no lore): merchants and other NPC icons look like one.
not_pedestal:
  - "(?i)^.*Merchant.*$"

# ---- Where detection is off --------------------------------------------------

# Screen titles in which no item is treated as legacy: menus that reuse glints and
# armour shells as buttons.
blocked_screen_titles:
  - "^Available .* Locations$"
  - "^Background Song$"
  - "^Island Rules$"
  - "^Island Settings$"
  - "^Island Weather$"
  - "^Move here!$"
  - "^Permission Groups$"
  - "^Permissions for .*$"
  - "^Select a Song$"

# Items that switch detection off for every item while one is anywhere in the
# player's inventory (the Block Bank is carried in housing edit mode).
inventory_suppressors:
  - "^Block Bank$"
