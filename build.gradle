plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version "${spotless_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	
	// Modrinth Maven for Wynntils
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}

	// Spotless resolves google-java-format from the *project* repositories at
	// task time, not from settings.gradle's pluginManagement block (which only
	// resolves the plugin itself). Loom injects mavenCentral today — junit-bom
	// resolves and is on no other declared repo — but loom_version is a
	// SNAPSHOT, so don't depend on that staying true.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/vetsmod.accessWidener")

	mods {
		"vetsmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// Wynntils dependency (compile only - users must have Wynntils installed separately)
	modCompileOnly "maven.modrinth:wynntils:v4.1.17-fabric"

	// Test harness (pure-logic unit tests, no Minecraft boot)
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21

	// Several files carry raw UTF-8 bytes inside string and char literals (the
	// PUA rank glyphs in chat/ and items/, the raw '§' in ChatUtils). That
	// compiles today only because JEP 400 pins javac's default charset to
	// UTF-8; native.encoding on a Windows box is still Cp1252. Pin it.
	it.options.encoding = 'UTF-8'

	// Javadoc reference gate — the Java side's only mechanical gate.
	// `reference` checks {@link}, @see, {@value} and @throws targets plus
	// @param name matching. Deliberately not `all` and not `html`: PillCodec's
	// class Javadoc has a hand-built <table border="1"> that -Xdoclint:html
	// rejects, and `missing` would light up most of the repo. /private sets
	// the access level explicitly rather than inheriting javac's default.
	it.options.compilerArgs.add('-Xdoclint:reference/private')
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Make the unified `test` source set see both main + client outputs so
// pure-logic tests can reference SpoilerCodec / RankChangeListener (client) and
// VetsLogger (main) from a single src/test/java/ tree.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

// Format gate. `./gradlew spotlessApply` rewrites; `spotlessCheck` is wired
// into `check` — and so into `build` — by the plugin itself.
spotless {
	encoding 'UTF-8'

	// The default is LineEnding.GIT_ATTRIBUTES_FAST_ALLSAME, which resolves
	// through core.autocrlf=true to CRLF on Windows and LF on the ubuntu
	// runner. This and the `*.java text eol=lf` rule in .gitattributes solve
	// different halves: that one stops git handing Spotless a CRLF worktree,
	// this one stops Spotless caring what git said.
	lineEndings = com.diffplug.spotless.LineEnding.UNIX

	java {
		// Explicit, so the target never drifts with Loom's source-set setup
		// and never picks up generated sources under build/.
		target 'src/main/java/**/*.java',
				'src/client/java/**/*.java',
				'src/test/java/**/*.java'

		// AOSP: 4-space block indent, 8-space continuation, 100 columns.
		//
		// formatJavadoc(false) — the default is TRUE. Left on it reflows 1,153
		// Javadoc blocks across 162 of 167 files inside a commit whose whole
		// value is being mechanical, and rewrites PillCodec's hand-built
		// <table>/<pre> diagrams. Blocks still re-indent with their
		// declaration; only the prose is spared.
		//
		// reflowLongStrings stays false (the default): it splits long literals
		// into concatenations, which is a token change, not formatting.
		//
		// reorderImports is left at its default, and it is counter-intuitive:
		// it does not decide *whether* gjf's ImportOrderer runs — it always
		// runs — it decides which style. false => Style.GOOGLE => one
		// ASCII-sorted block, statics first. We want AOSP code style with
		// Google import order, which is exactly the default.
		//
		// google-java-format also removes unused imports unconditionally, with
		// no opt-out on this step. Ten imports here are kept alive only by a
		// Javadoc {@link}; gjf's remover is DocTree-aware, so they survive.
		googleJavaFormat("${google_java_format_version}")
				.aosp()
				.formatJavadoc(false)
				.reflowLongStrings(false)
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Optional per-developer extensions (e.g. deploy-to-launcher tasks).
// See local.gradle.example for the pattern.
if (file('local.gradle').exists()) {
	apply from: 'local.gradle'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}